const LE_STORAGE_KEY=(pid,type)=>`le_v15_draft_${pid}_${type}`;
function leGetDraft(type){try{return JSON.parse(localStorage.getItem(LE_STORAGE_KEY(state.participant.id,type))||'{}')||{}}catch(_){return {}}}
function leSetDraft(type,draft){try{localStorage.setItem(LE_STORAGE_KEY(state.participant.id,type),JSON.stringify(draft))}catch(_){}}
function leScore(questions,draft){const totals={},counts={};questions.forEach(q=>{const a=draft[q.question_code];if(!a?.choice)return;const opt=q.options[String(a.choice).charCodeAt(0)-65];const profile=LE_STYLE_PROFILES[opt?.style]||{};Object.entries(profile).forEach(([k,v])=>{totals[k]=(totals[k]||0)+v;counts[k]=(counts[k]||0)+1})});const result={};Object.keys(totals).forEach(k=>result[k]=Math.round(totals[k]/counts[k]));return result}
function leScoreRows(scores){const entries=Object.entries(scores||{}).filter(([k,v])=>Number.isFinite(Number(v))).sort((a,b)=>b[1]-a[1]);return entries.map(([k,v])=>`<div class="le-score-row"><span>${esc(LE_DIMENSION_LABELS[k]||k.replace(/_/g,' '))}</span><div class="le-score-track"><i style="width:${Math.max(0,Math.min(100,Number(v)))}%"></i></div><b>${Number(v)}%</b></div>`).join('')}
function leTopScoreRows(scores,count=3,ascending=false){const entries=Object.entries(scores||{}).filter(([k,v])=>Number.isFinite(Number(v))).sort((a,b)=>ascending?Number(a[1])-Number(b[1]):Number(b[1])-Number(a[1])).slice(0,count);return entries.map(([k,v])=>`<div class="le-score-row"><span>${esc(LE_DIMENSION_LABELS[k]||k.replace(/_/g,' '))}</span><div class="le-score-track"><i style="width:${Math.max(0,Math.min(100,Number(v)))}%"></i></div><b>${Number(v)}%</b></div>`).join('')}
function leSummary(scores){const e=Object.entries(scores||{}).sort((a,b)=>b[1]-a[1]);return {strengths:e.slice(0,3).map(([k,v])=>({code:k,label:LE_DIMENSION_LABELS[k]||k,score:v})),growth:e.slice(-3).reverse().map(([k,v])=>({code:k,label:LE_DIMENSION_LABELS[k]||k,score:v})),note:'Profil awal berdasarkan pilihan situasional. Bukan diagnosis kepribadian dan perlu diverifikasi melalui praktik, observasi, serta feedback mentor.'}}
function leProgress(type){const qs=type==='competency'?LE_COMPETENCY_QUESTIONS:LE_PERSONALITY_QUESTIONS;const d=leGetDraft(type);const n=qs.filter(q=>d[q.question_code]?.choice).length;const el=document.getElementById(`leProgress_${type}`);const fill=document.getElementById(`leProgressFill_${type}`);if(el)el.textContent=`${n}/${qs.length} terjawab`;if(fill)fill.style.width=`${Math.round(n/qs.length*100)}%`}
function leSaveChoice(type,code,val){const d=leGetDraft(type);d[code]={...(d[code]||{}),choice:val};leSetDraft(type,d);leProgress(type)}
function leRenderQuestion(q,i,type,draft){return `<article class="le-question" id="leq_${type}_${q.question_code}"><div class="le-question-head"><div class="le-qnum">${i+1}</div><div><span class="le-chip">${esc(q.title)}</span><h3 style="margin:8px 0">${esc(q.prompt)}</h3><p class="le-muted" style="margin:0">${esc(q.scenario)}</p></div></div><div style="margin-top:12px">${q.options.map((o,j)=>`<label class="le-option"><input type="radio" name="${type}_${q.question_code}" value="${String.fromCharCode(65+j)}" ${draft[q.question_code]?.choice===String.fromCharCode(65+j)?'checked':''} onchange="leSaveChoice('${type}','${q.question_code}','${String.fromCharCode(65+j)}')"><span>${esc(o.label)}</span></label>`).join('')}</div></article>`}

/* V16: assessment completion locks each test; retake needs explicit approval. */
async function participantAssessmentPage(){
 if(!state.participant?.id)return `<div class="card"><h2>Assessment belum tersedia</h2><p class="muted">Data peserta belum terhubung dengan akun ini.</p></div>`;
 let sessions=[],requests=[];
 try{
  const [sr,rr]=await Promise.all([
   sb.from('le_assessment_sessions').select('id,assessment_type,status,scores,summary,completed_at,created_at').eq('participant_id',state.participant.id).order('created_at',{ascending:false}),
   sb.from('le_assessment_retake_requests').select('*').eq('participant_id',state.participant.id).order('requested_at',{ascending:false})
  ]);
  if(sr.error)throw sr.error;if(rr.error)throw rr.error;sessions=sr.data||[];requests=rr.data||[];
 }catch(e){return `<div class="le-hero"><div><span class="le-kicker">Assessment Engine</span><h2>Assessment peserta</h2><p>Untuk mengaktifkan kontrol pengulangan asesmen, jalankan migrasi V16.</p><div class="error">${esc(errText(e))}</div></div></div>`}
 const types=[{type:'competency',label:'Competency & Situational Judgment',short:'Assessment A',n:25,questions:LE_COMPETENCY_QUESTIONS},{type:'personality',label:'Personality & Engineer Mindset',short:'Assessment B',n:20,questions:LE_PERSONALITY_QUESTIONS}];
 const statusByType={};types.forEach(t=>{statusByType[t.type]={done:sessions.find(s=>s.assessment_type===t.type&&s.status==='completed'),request:requests.find(r=>r.assessment_type===t.type&&['pending','approved'].includes(r.status))}});
 const requestedType=window.leActiveAssessmentType||types.find(t=>!statusByType[t.type].done||statusByType[t.type].request?.status==='approved')?.type||'competency';
 let html=`<div class="le-hero"><div><span class="le-kicker">LEARNER INTELLIGENCE</span><h2>Assessment & profil awal</h2><p>Setiap asesmen baseline hanya dapat diselesaikan satu kali. Setelah selesai, akses tes dikunci; jika perlu mengulang, ajukan permintaan kepada mentor atau admin.</p></div><div class="le-orbit"><span></span><span></span><span></span><b>LE</b></div></div><div class="le-assessment-status-grid">`;
 for(const t of types){const st=statusByType[t.type];let body='';if(st.done&&st.request?.status!=='approved'){
   body=`<span class="pill ok">Selesai · terkunci</span><p class="small muted">Selesai ${fmtDate(st.done.completed_at)}. Hasil tersimpan dan tidak dapat diubah.</p><button class="btn ghost small" onclick="go('profile')">Lihat hasil di profil</button>`;
   if(st.request?.status==='pending')body+=`<div class="notice" style="margin-top:10px">Permintaan pengulangan sedang menunggu mentor/admin.</div>`;
   else body+=`<button class="btn primary small" style="margin-top:10px" onclick="openRetakeRequest('${t.type}')">Minta izin mengulang</button>`;
 }else if(st.done&&st.request?.status==='approved'){
   body=`<span class="pill info">Izin mengulang disetujui</span><p class="small muted">Izin hanya berlaku untuk satu pengulangan. Hasil sebelumnya tetap disimpan sebagai riwayat.</p><button class="btn primary small" onclick="startLEAssessment('${t.type}')">Mulai pengulangan</button>`;
 }else{
   body=`<span class="pill ${st.done?'ok':'warn'}">${st.done?'Selesai':'Belum dikerjakan'}</span><p class="small muted">${st.done?'Hasil tersimpan.':'Belum ada hasil final untuk asesmen ini.'}</p><button class="btn primary small" onclick="startLEAssessment('${t.type}')">${st.done?'Lihat status':'Mulai '+t.short}</button>`;
 }
 html+=`<div class="le-assessment-status"><h3>${t.label}</h3><p class="le-muted">${t.n} pertanyaan · pilihan berbasis situasi, bukan kunci benar tunggal.</p>${body}</div>`;
 }
 html+=`</div>`;
 const active=types.find(t=>t.type===requestedType);const activeState=statusByType[active.type];
 if(!activeState.done||activeState.request?.status==='approved')html+=`<div id="leAssessmentWorkspace" style="margin-top:16px">${leRenderTest(active.type,active.questions)}</div>`;
 const completed=types.filter(t=>statusByType[t.type].done);
 if(completed.length)html+=`<div class="le-panel" style="margin-top:16px"><h3>Hasil yang tersimpan</h3><div class="le-score-grid">${completed.map(t=>{const x=statusByType[t.type].done;return `<div class="le-score-card"><span class="le-chip">${t.short}</span><h3>${t.label}</h3>${leScoreRows(x.scores||{})}<p class="le-muted">Selesai ${fmtDate(x.completed_at)}</p></div>`}).join('')}</div></div>`;
 return html;
}

 }catch(e){toast('Assessment belum berhasil disimpan: '+errText(e),true)}
}

async function v17BuildPlan(){
 const participantId=document.getElementById('v17Participant')?.value;
 const out=document.getElementById('v17PlannerResults');if(!participantId){toast('Pilih peserta terlebih dahulu.',true);return}if(out)out.innerHTML='<div class="v17-empty">Menyusun rekomendasi dari hasil asesmen dan katalog aktivitas…</div>';
 try{
  const [sr,cr,mr,simr,ar]=await Promise.all([
   sb.from('le_assessment_sessions').select('assessment_type,scores,summary,completed_at').eq('participant_id',participantId).eq('status','completed').order('completed_at',{ascending:false}),
   sb.from('courses').select('id,course_code,name,description,difficulty,status,content').eq('status','active').order('name').limit(300),
   sb.from('missions').select('id,mission_code,name,description,difficulty,status,instructions,success_criteria').eq('status','active').order('name').limit(300),

  ]);
  for(const r of [sr,cr,mr,simr,ar])if(r.error)throw r.error;
  const latest={};(sr.data||[]).forEach(x=>{if(!latest[x.assessment_type])latest[x.assessment_type]=x});
  const scores=[...Object.entries(latest.competency?.scores||{}).map(([k,v])=>({key:k,score:Number(v),source:'Kompetensi'})),...Object.entries(latest.personality?.scores||{}).map(([k,v])=>({key:k,score:Number(v),source:'Personality'}))].filter(x=>Number.isFinite(x.score)).sort((a,b)=>a.score-b.score);
  if(!scores.length)throw new Error('Peserta belum memiliki hasil Assessment A/B yang selesai. Selesaikan asesmen terlebih dahulu.');
  const count=Number(document.getElementById('v17GapCount')?.value)||4;const gaps=scores.slice(0,count);const assets=[...(cr.data||[]).map(x=>({...x,activity_type:'course'})),...(mr.data||[]).map(x=>({...x,activity_type:'mission'})),...(simr.data||[]).map(x=>({...x,activity_type:'simulation'}))];
  const existing=ar.data||[];const existingKeys=new Set(existing.map(x=>`${x.activity_type}:${x.activity_id}`));let items=[];const added=new Set();
  const fallbackTerms={};
  for(const gap of gaps){const label=LE_DIMENSION_LABELS[gap.key]||gap.key.replace(/_/g,' ');const terms=v17Terms(gap.key,label);let matches=assets.map(a=>{const txt=v17Text(a);const hits=terms.filter(t=>t&&txt.includes(t)).length;return {...a,hits,dimension:gap.key,dimensionLabel:label,score:gap.score,source:gap.source,reason:`Prioritas ${label} berdasarkan hasil ${gap.source.toLowerCase()} (${Math.round(gap.score)}%). Relevansi aktivitas perlu ditinjau mentor.`}}).filter(a=>a.hits>0).sort((a,b)=>b.hits-a.hits);
   // If keyword matching is weak, offer the most general active course for human review rather than fabricating a semantic match.
   if(!matches.length){const general=(cr.data||[]).slice(0,2).map(a=>({...a,activity_type:'course',hits:0,dimension:gap.key,dimensionLabel:label,score:gap.score,source:gap.source,reason:`Belum ada kecocokan kata kunci kuat untuk ${label}. Course ini ditawarkan hanya untuk ditinjau manual, bukan dianggap cocok otomatis.`}));matches=general;}
   let addedForGap=0;for(const a of matches){const key=`${a.activity_type}:${a.id}`;if(added.has(key))continue;added.add(key);items.push({id:a.id,activity_type:a.activity_type,name:a.name||'Aktivitas',code:a.course_code||a.mission_code||a.simulation_code||'',description:a.description||a.scenario||a.instructions||'',difficulty:a.difficulty||'—',dimension:a.dimension,dimensionLabel:a.dimensionLabel,score:a.score,source:a.source,reason:a.reason,hits:a.hits,alreadyAssigned:existingKeys.has(key),existingStatus:existing.find(x=>`${x.activity_type}:${x.activity_id}`===key)?.status||null,selected:!existingKeys.has(key),priority:1});addedForGap++;if(addedForGap>=2)break;}
  }
  items.sort((a,b)=>a.score-b.score||b.hits-a.hits);
  items.forEach((x,i)=>x.priority=Math.min(5,Math.floor(i/2)+1));
  window.leV17Plan={items,participantId,existing,lastBuilt:new Date().toISOString(),scores,gaps};
  v17RenderPlan();
 }catch(e){if(out)out.innerHTML=`<div class="v17-panel"><h3>Rekomendasi belum dapat dibuat</h3><div class="error">${esc(errText(e))}</div><p class="v17-muted">Periksa bahwa peserta memiliki hasil asesmen selesai dan tabel course, missions, simulations, serta learning_assignments dapat dibaca oleh akun ini.</p></div>`;toast('Planner: '+errText(e),true)}
}

function v17FilterCards(){const q=(document.getElementById('v17Search')?.value||'').toLowerCase();document.querySelectorAll('#v17RecommendationCards .v17-rec').forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(q)?'flex':'none'})}
async function v17BatchAssign(){
 const plan=window.leV17Plan;if(!plan?.participantId){toast('Buat rekomendasi terlebih dahulu.',true);return}
 const chosen=plan.items.filter(x=>x.selected&&!x.alreadyAssigned);if(!chosen.length){toast('Pilih minimal satu aktivitas yang belum ditugaskan.',true);return}
 const dueStart=document.getElementById('v17Due')?.value||new Date(Date.now()+7*86400000).toISOString().slice(0,10);const mode=document.getElementById('v17PlanMode')?.value||'sequential';
 const participantOption=document.getElementById('v17Participant')?.selectedOptions?.[0]?.textContent||'peserta terpilih';
 const sorted=[...chosen].sort((a,b)=>a.priority-b.priority||(['course','simulation','mission'].indexOf(a.activity_type)-['course','simulation','mission'].indexOf(b.activity_type)));
 const rows=sorted.map((x,i)=>{const dt=new Date(dueStart+'T12:00:00');if(mode==='sequential')dt.setDate(dt.getDate()+Math.max(0,x.priority-1)*7);return {participant_id:plan.participantId,activity_type:x.activity_type,activity_id:x.id,due_date:dt.toISOString().slice(0,10),priority:x.priority,status:'active'}});
 const summary=`Peserta: ${participantOption}\nAktivitas: ${rows.length}\nMode: ${mode==='sequential'?'berurutan, tahap per 7 hari':'tenggat minggu yang sama'}\n\n${sorted.map((x,i)=>`${i+1}. ${v17ActivityKind(x.activity_type)} — ${x.name} (Prioritas ${x.priority})`).join('\n')}\n\nAktivitas yang sudah ada dilewati. Lanjutkan membuat semua assignment dalam satu batch?`;
 if(!confirm(summary))return;
 try{
  // Recheck existing assignments immediately before insert to avoid duplicate rows from a stale planner.
  const existingR=await sb.from('learning_assignments').select('activity_type,activity_id').eq('participant_id',plan.participantId);if(existingR.error)throw existingR.error;
  const seen=new Set((existingR.data||[]).map(x=>`${x.activity_type}:${x.activity_id}`));const finalRows=rows.filter(x=>!seen.has(`${x.activity_type}:${x.activity_id}`));
  if(!finalRows.length){toast('Semua aktivitas terpilih sudah ditugaskan. Tidak ada duplikat dibuat.',true);await v17BuildPlan();return}
  const ins=await sb.from('learning_assignments').insert(finalRows);if(ins.error)throw ins.error;
  toast(`${finalRows.length} aktivitas berhasil ditugaskan sekaligus dan akan muncul di Learning Path peserta.`);await v17BuildPlan();
 }catch(e){toast('Batch assignment belum berhasil: '+errText(e),true)}
}

boot();
</script>
