/* V10 additive experience layer: preserve existing WDS structure, improve hierarchy and interaction. */
:root{--bg:#f4f7fb;--panel:#fff;--text:#172b3a;--muted:#65758b;--line:#e3eaf1;--accent:#087f78;--accent2:#06645f;--shadow:0 10px 32px rgba(18,38,63,.07)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em;line-height:1.5}

/* V13 Login experience: branded welcome page, no backend jargon on screen */
.login-wrap{min-height:100vh;padding:clamp(16px,4vw,48px);background:radial-gradient(circle at 12% 12%,#c8f5eb 0,transparent 30%),radial-gradient(circle at 88% 88%,#dbeafe 0,transparent 32%),linear-gradient(135deg,#f8fbff,#eef7f5);}

.login-visual:before,.login-visual:after{content:"";position:absolute;border:1px solid #ffffff22;border-radius:50%;pointer-events:none}.login-visual:before{width:430px;height:430px;right:-140px;top:-110px}.login-visual:after{width:310px;height:310px;right:-75px;top:-50px}

.login-brandline{display:flex;align-items:center;gap:12px;position:relative;z-index:1}.login-brandmark{width:48px;height:48px;border-radius:15px;background:#ffffff17;border:1px solid #ffffff35;display:grid;place-items:center;font-size:22px;font-weight:900}.login-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:#9fe9da}.login-visual h1{position:relative;z-index:1;font-size:clamp(34px,4.2vw,54px);letter-spacing:-.055em;line-height:1.04;margin:18px 0 16px;max-width:520px}.login-visual p{position:relative;z-index:1;color:#d2eeea;line-height:1.75;max-width:470px}.login-feature-list{position:relative;z-index:1;display:grid;gap:12px;margin-top:28px}.login-feature{display:flex;align-items:center;gap:12px;color:#edfffb;font-size:13px}.login-feature i{font-style:normal;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#ffffff17;border:1px solid #ffffff24}.login-footer{position:relative;z-index:1;color:#a9d9d3;font-size:11px;margin-top:30px}.login-panel{padding:clamp(26px,4vw,48px);display:flex;flex-direction:column;justify-content:center}.login-panel .brand{display:none}.login-panel h2{font-size:28px;letter-spacing:-.04em;margin:0 0 8px}.login-subtitle{font-size:13px;color:#667085;line-height:1.6;margin:0 0 22px}.login-panel label{margin-top:15px}.login-panel input,.login-panel select{padding:13px 14px;border-radius:12px;background:#fbfdff}.login-panel input:focus,.login-panel select:focus{outline:3px solid #0f766e20;border-color:#0f766e}.login-panel .btn{padding:13px 16px;border-radius:12px}.login-panel .btn.primary{box-shadow:0 8px 18px #0f766e26}.login-switch{text-align:center;font-size:13px;color:#667085;margin-top:14px}.login-switch button{color:#087f78;border:0;background:none;font-weight:800;padding:4px}.login-note{font-size:11px;color:#7b8797;line-height:1.6;margin-top:18px}.login-panel .notice{background:#f0fdfa;border-color:#d5f0e9;color:#245d58}.login-panel .error,.login-panel .success{marg @media(max-width:420px){.login-feature-list{grid-template-columns:1fr}.login-visual h1{font-size:31px}}



/* V14 additive workspace experience: soft professional navigation and interactive learning surfaces.
   All selectors are scoped to the authenticated workspace; the V13 login page is intentionally untouched. */
.shell{--work-bg:#f4f7f8;--work-card:#ffffff;--work-line:#e4ebed;--work-ink:#21343b;--work-muted:#708087;--work-teal:#287f78;--work-teal-soft:#eaf6f3;--work-lilac:#f2effb;--work-sand:#fbf5eb;background:var(--work-bg);color:var(--work-ink)}
.shell .side{background:linear-gradient(180deg,#173b3b 0%,#183333 100%);padding:20px 14px;border-right:1px solid #ffffff12}

.shell .nav button.active{background:linear-gradient(100deg,#2b6c66,#25544f);border-color:#6cb7aa38;color:#fff;box-shadow:0 5px 16px #081d1c25}
.shell .nav button.active .nav-glyph{background:#ffffff19;color:#fff}
.shell .side-bottom{margin:20px 6px 0;padding:15px 8px 0;color:#b9cecb;line-height:1.8}
.shell .top{background:#ffffffed;backdrop-filter:blur(14px);border-bottom-color:var(--work-line);padding:0 30px;box-shadow:0 3px 16px #243c4105}
.shell .top-title{font-size:14px;letter-spacing:-.02em;color:#30474d}
.shell .top-user{gap:12px}.shell .avatar{background:#e2f3ed;color:#24776e}
.shell .content{padding:28px;max-width:1540px}

.shell .pill{padding:5px 9px;letter-spacing:.01em}.shell .bar,.shell .progress-track{background:#e9eff0}
.shell .activity-card{background:linear-gradient(180deg,#fff 0%,#fcfefe 100%);padding:19px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}

.shell .hero-strip{border-radius:20px;background:radial-gradient(circle at 85% 20%,#ffffff25,transparent 32%),linear-gradient(120deg,#214d4b,#287f78 68%,#65a99a);box-shadow:0 10px 26px #287f7817}

.shell .list-item{border-color:var(--work-line);border-radius:12px;background:#fff}

<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
// V8.2: additive update based on user-provided V8.1 source; existing flows retained.
const SUPABASE_URL="https://olkwmzlghxymbzwbethc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_EMBgf0aZBwbt1utZ47jVpQ_qtMCTCOY";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
// Centralized runtime diagnostics: surface unexpected errors in the app instead of failing silently.
window.addEventListener("error",function(ev){
  try{ const c=document.getElementById("content"); if(c && !c.querySelector(".error")){ const d=document.createElement("div"); d.className="error"; d.style.marginBottom="14px"; d.innerHTML="<b>Terjadi error pada aplikasi.</b><br>Periksa halaman yang sedang dibuka dan catat pesan error pada Console browser."; c.prepend(d); } }catch(_e){}
});
window.addEventListener("unhandledrejection",function(ev){
  try{ const msg=ev?.reason?.message||"Operasi async gagal."; const c=document.getElementById("content"); if(c && !c.querySelector(".error")){ const d=document.createElement("div"); d.className="error"; d.style.marginBottom="14px"; d.textContent="Operasi gagal: "+msg; c.prepend(d); } }catch(_e){}
});
let state={session:null,profile:null,participant:null,page:"dashboard",loading:false,connection:{ok:false,checked:false,error:null},syncTimer:null};
function setConnection(ok,error=null){state.connection={ok,checked:true,error};const el=document.getElementById("connectionStatus");if(el){el.textContent=ok?"? Supabase Connected":"? Supabase Offline";el.style.color=ok?"#027a48":"#b42318"}}
async function checkSupabaseConnection(){
  try{
    const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),8000);
    const res=await fetch(SUPABASE_URL+"/rest/v1/",{method:"GET",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer "+SUPABASE_PUBLISHABLE_KEY},signal:controller.signal,cache:"no-store"});
    clearTimeout(timer);
    // 200/401/404 all prove DNS/TLS/HTTP connectivity. We only treat network errors as offline.
    setConnection(true); return {ok:true,status:res.status};
  }catch(e){setConnection(false,e);return {ok:false,error:e}}
}

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmtDate=s=>s?new Date(s).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}):"—";
const pill=s=>`<span class="pill ${["active","approved","work_ready","autonomy_ready"].includes(s)?"ok":["pending_review","development_required"].includes(s)?"warn":["not_ready","archived"].includes(s)?"bad":"info"}">${esc(s||"—")}</span>`;
function toast(msg,bad=false){const d=document.createElement("div");d.className="toast";d.textContent=msg;if(bad)d.style.background="#b42318";document.getElementById("toastRoot").appendChild(d);setTimeout(()=>d.remove(),3200)}
function errText(e){return e?.message||e?.error_description||"Terjadi kesalahan."}
async function db(q,label="Database"){const {data,error}=await q;if(error){toast(label+": "+error.message,true);throw error}return data}
function modal(title,body,actions=""){document.getElementById("modalRoot").innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="btn ghost small" onclick="closeModal()">?</button></div>${body}${actions?`<div class="actions">${actions}</div>`:""}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function actionBtn(label,fn,cls="primary"){return `<button class="btn ${cls} small" onclick="${fn}">${label}</button>`}

async function boot(){
 renderLogin();
 const health=await checkSupabaseConnection();
 if(!health.ok){
   authMsg("Layanan masuk belum dapat dijangkau. Periksa koneksi internet, lalu coba lagi.",true);
   return;
 }
 try{
   const {data:{session},error}=await sb.auth.getSession();
   if(error)throw error;
   state.session=session;
   if(!session)return;
   const ok=await loadProfile();
   if(!ok){renderLogin();return;}
   
   render(); startSync();
   sb.auth.onAuthStateChange(async(_e,s)=>{state.session=s;if(!s){state.profile=null;state.participant=null;renderLogin()}else{const ok=await loadProfile();if(ok){render();startSync()}}});
 }catch(e){authMsg("Sesi belum dapat disiapkan. Silakan muat ulang halaman dan coba kembali.",true)}
}
async function loadProfile(){
 if(!state.session?.user?.id)return false;
 const uid=state.session.user.id;
 const {data,error}=await sb.from("profiles").select("id,full_name,email,role,avatar_url,status,created_at,updated_at,requested_role").eq("id",uid).maybeSingle();
 if(error){authMsg("Data akun belum dapat dibaca: "+error.message,true);return false}
 if(!data){authMsg("Akun berhasil dikenali, tetapi profil belum tersedia. Hubungi pengelola sistem.",true);return false}
 state.profile=data;
 const {data:p,error:pe}=await sb.from("participants").select("*").eq("profile_id",uid).maybeSingle();
 if(pe){authMsg("Data participant gagal dibaca: "+pe.message,true);return false}
 if(p){state.participant=p;return true;}
 // Email-confirmed signups may have no session during signUp; provision the participant on first verified login.
 if(data.role==="participant"){
   const meta=state.session.user.user_metadata||{};
   const code=`PKL-${new Date().getFullYear()}-${uid.replace(/-/g,"").slice(0,8).toUpperCase()}`;
   const payload={profile_id:uid,participant_code:code,school:meta.school||null,major:meta.major||null,batch:meta.batch||null,start_date:meta.start_date||null,pkl_position:meta.pkl_position||null,status:"active"};
   const {data:created,error:ce}=await sb.from("participants").upsert(payload,{onConflict:"profile_id"}).select("*").single();
   if(ce){authMsg("Akun sudah terdaftar, tetapi data peserta belum bisa dibuat: "+ce.message,true);return false;}
   state.participant=created;
 } else state.participant=null;
 return true;

 const rows=await db(q,"Participants");return `<div class="toolbar"><div class="left"><h2 style="margin:0">Participants</h2></div><div class="right">${state.profile.role==="admin"?actionBtn("+ Participant manual","openParticipantForm()","primary"):""}</div></div><div class="notice" style="margin-bottom:12px">Penghapusan akun bersifat permanen dan menghapus data pembelajaran milik peserta. Pastikan peserta yang dipilih benar.</div><div class="card">${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Code</th><th>Name</th><th>Email</th><th>School</th><th>Status</th><th>Start</th>${state.profile.role==='admin'?'<th>Aksi</th>':''}</tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.participant_code)}</b></td><td>${esc(p.profiles?.full_name)}</td><td>${esc(p.profiles?.email)}</td><td>${esc(p.school||"—")}</td><td>${pill(p.status)}</td><td>${fmtDate(p.start_date)}</td>${state.profile.role==='admin'?`<td>${actionBtn('Hapus akun',`confirmDeleteParticipant('${p.id}','${esc(p.profiles?.full_name||p.participant_code||'peserta').replace(/'/g,"&#39;")}')`,'danger')}</td>`:''}</tr>`).join("")}</tbody></table></div>`:`<div class="empty">Belum ada participant.</div>`}</div>`;
}
function confirmDeleteParticipant(id,name){modal('Hapus akun peserta?',`<div class="error"><b>PERMANEN:</b> akun <b>${esc(name)}</b> beserta data assessment, competency profile, learning path, submission/evidence, feedback, dan data peserta terkait akan dihapus. Konten course/mission global tidak ikut dihapus.</div><p>Pastikan kamu memilih akun yang benar. Tindakan ini tidak bisa dibatalkan.</p><label>Ketik HAPUS untuk konfirmasi</label><input id="deleteParticipantConfirm" placeholder="HAPUS">`,actionBtn('Hapus seluruh data peserta',`deleteParticipantAccount('${id}')`,'danger')+actionBtn('Batal','closeModal()','ghost'))}
async function deleteParticipantAccount(id){try{if(document.getElementById('deleteParticipantConfirm')?.value.trim()!=='HAPUS')throw new Error('Ketik HAPUS untuk mengonfirmasi.');if(state.profile.role!=='admin')throw new Error('Hanya admin yang dapat menghapus akun peserta.');const {data,error}=await sb.rpc('admin_delete_participant_account',{p_participant_id:id});if(error)throw error;closeModal();toast('Akun peserta dan data terkait berhasil dihapus.');go('participants')}catch(e){toast('Penghapusan belum berhasil: '+errText(e)+'. Pastikan SQL fungsi admin_delete_participant_account sudah dijalankan.',true)}}
function openParticipantForm(){modal("Tambah Participant",`<div class="notice">Untuk data nyata, participant sebaiknya mendaftar melalui Auth. Form ini hanya membuat record participant untuk profile yang sudah ada dan sesuai RLS.</div><label>Profile UUID</label><input id="pfProfile" placeholder="UUID profile"><label>Participant Code</label><input id="pfCode"><label>Sekolah</label><input id="pfSchool"><label>Jurusan</label><input id="pfMajor">`,actionBtn("Simpan","createParticipant()","primary")+actionBtn("Batal","closeModal()","ghost"))}
async function createParticipant(){try{const o={profile_id:document.getElementById("pfProfile").value.trim(),participant_code:document.getElementById("pfCode").value.trim(),school:document.getElementById("pfSchool").value.trim()||null,major:document.getElementById("pfMajor").value.trim()||null};await db(sb.from("participants").insert(o),"Create participant");closeModal();toast("Participant dibuat");go("participants")}catch(e){}}

async function mentorsPage(){
 const rows=await db(sb.from("profiles").select("id,full_name,email,role,requested_role,status,created_at").or("role.eq.mentor,requested_role.eq.mentor").order("created_at",{ascending:false}),"Mentor");
 let counts={};
 try{const r=await sb.from("mentor_participants").select("mentor_id,participant_id,status").eq("status","active");if(r.error)throw r.error;(r.data||[]).forEach(x=>counts[x.mentor_id]=(counts[x.mentor_id]||0)+1)}catch(e){/* table/policy health is shown below */}
 let relationWarning='';
 try{const r=await sb.from('mentor_participants').select('mentor_id').limit(1);if(r.error)throw r.error}catch(e){relationWarning=`<div class="error" style="margin-bottom:12px"><b>Relasi mentor–peserta belum dapat dibaca.</b> ${esc(errText(e))} Jalankan migrasi integrasi V19, lalu periksa RLS.</div>`}
 return `<div class="toolbar"><div><h2 style="margin:0">Mentor Management</h2><p class="small muted">Persetujuan akun dan penempatan peserta dilakukan dari sini.</p></div><button class="btn ghost small sync-button" onclick="syncNow()">↻ Sinkronkan</button></div>${relationWarning}<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>Email</th><th>Status</th><th>Peserta aktif</th><th>Aksi</th></tr></thead><tbody>${rows.map(m=>`<tr><td><b>${esc(m.full_name||'—')}</b></td><td>${esc(m.email||'—')}</td><td>${pill(m.status)}</td><td>${counts[m.id]||0}</td><td>${m.status==='pending_review'?actionBtn('Setujui',`approveMentor('${m.id}')`,'primary'):''} ${m.status==='active'?actionBtn('Kelola peserta',`openMentorAssignment('${m.id}')`,'primary')+actionBtn('Tahan akun',`holdMentor('${m.id}')`,'danger'):''}</td></tr>`).join('')||'<tr><td colspan="5">Belum ada mentor.</td></tr>'}</tbody></table></div></div><div class="notice" style="margin-top:12px">Mentor hanya boleh melihat peserta yang ditugaskan kepadanya. Penempatan tidak menghapus riwayat penilaian atau bukti yang sudah tersimpan.</div>`;
}
async function openMentorAssignment(mentorId,mentorName="Mentor"){
 try{
  const [people,assigned]=await Promise.all([
   db(sb.from('participants').select('id,participant_code,profile_id,status,profiles(full_name,email)').order('participant_code'),'Daftar peserta'),
   db(sb.from('mentor_participants').select('participant_id,status').eq('mentor_id',mentorId),'Penempatan mentor')
  ]);
  const current=new Set((assigned||[]).filter(x=>x.status==='active').map(x=>x.participant_id));
  modal('Penempatan peserta · '+mentorName,`<div class="notice">Centang peserta yang menjadi tanggung jawab mentor ini. Menyimpan perubahan hanya memperbarui relasi penempatan; riwayat pembelajaran dan penilaian tidak dihapus.</div><input id="mentorAssignSearch" placeholder="Cari nama, kode, sekolah..." oninput="filterMentorAssignRows()"><div class="small muted" id="mentorAssignCount">${current.size} peserta dipilih</div><div id="mentorAssignRows" style="max-height:45vh;overflow:auto">${people.map(p=>`<label class="sjt-option mentor-assign-row" data-search="${esc([p.participant_code,p.profiles?.full_name,p.profiles?.email,p.status].filter(Boolean).join(' ').toLowerCase())}"><input type="checkbox" name="mentorAssignedParticipant" value="${p.id}" ${current.has(p.id)?'checked':''} onchange="updateMentorAssignCount()"><span><b>${esc(p.profiles?.full_name||p.participant_code||'Peserta')}</b><small class="muted" style="display:block">${esc(p.participant_code||'')} · ${esc(p.profiles?.email||'')} · ${esc(p.status||'')}</small></span></label>`).join('')||'<div class="empty">Belum ada peserta terdaftar.</div>'}</div>`,actionBtn('Simpan penempatan',`saveMentorAssignment('${mentorId}')`,'primary')+actionBtn('Batal','closeModal()','ghost'));
  updateMentorAssignCount();
 }catch(e){toast('Penempatan belum dapat dibuka: '+errText(e),true)}
}
function filterMentorAssignRows(){const q=(document.getElementById('mentorAssignSearch')?.value||'').toLowerCase().trim();document.querySelectorAll('.mentor-assign-row').forEach(r=>r.style.display=!q||r.dataset.search.includes(q)?'':'none')}
function updateMentorAssignCount(){const el=document.getElementById('mentorAssignCount');if(el)el.textContent=document.querySelectorAll('input[name="mentorAssignedParticipant"]:checked').length+' peserta dipilih'}
async function saveMentorAssignment(mentorId){
 try{
  if(state.profile?.role!=='admin')throw new Error('Hanya admin yang dapat mengubah penempatan mentor.');
  const selected=[...document.querySelectorAll('input[name="mentorAssignedParticipant"]:checked')].map(x=>x.value);
  const existing=await db(sb.from('mentor_participants').select('participant_id,status').eq('mentor_id',mentorId),'Baca penempatan lama');
  const active=new Set((existing||[]).filter(x=>x.status==='active').map(x=>x.participant_id));
  const add=selected.filter(id=>!active.has(id));const remove=[...active].filter(id=>!selected.includes(id));
  if(add.length){const ins=await sb.from('mentor_participants').upsert(add.map(participant_id=>({mentor_id:mentorId,participant_id,status:'active'})),{onConflict:'mentor_id,participant_id'});if(ins.error)throw ins.error}
  if(remove.length){const del=await sb.from('mentor_participants').update({status:'inactive'}).eq('mentor_id',mentorId).in('participant_id',remove);if(del.error)throw del.error}
  closeModal();toast('Penempatan mentor berhasil diperbarui.');go('mentors');
 }catch(e){toast('Penempatan belum tersimpan: '+errText(e)+' Pastikan migrasi V19 dan kebijakan RLS sudah diterapkan.',true)}
}

async function holdMentor(id){try{await db(sb.from("profiles").update({status:"pending_review"}).eq("id",id),"Hold mentor");toast("Mentor ditahan");go("mentors")}catch(e){}}

function filterAssessmentRows(){const q=(document.getElementById('assessmentSearch')?.value||'').toLowerCase().trim();const rows=[...document.querySelectorAll('#assessmentRows tr[data-search]')];let n=0;rows.forEach(r=>{const show=!q||r.dataset.search.includes(q);r.style.display=show?'':'none';if(show)n++});const c=document.getElementById('assessmentVisibleCount');if(c)c.textContent=n+' item';}

function renderScoringRubric(raw){let r=raw;try{if(typeof r==='string')r=JSON.parse(r)}catch(_){return `<div class="notice" style="margin-top:8px;white-space:pre-wrap">${esc(String(raw))}</div>`}if(!r||typeof r!=='object')return `<div class="empty">Rubrik belum diatur.</div>`;const labels={0:['Kritis','Respons tidak aman, tidak berdasarkan fakta, atau melanggar batas kewenangan.'],25:['Sangat lemah','Belum mengenali risiko utama dan belum memiliki langkah yang layak.'],50:['Berkembang','Mengenali sebagian masalah tetapi analisis atau tindak lanjut belum lengkap.'],70:['Fungsional','Langkah cukup tepat, aman, dan didukung alasan dasar.'],85:['Kuat','Berpikir sistematis, memeriksa bukti, berkomunikasi dan melakukan follow-up.'],100:['Unggul','Antisipatif, terukur, menjaga batas kewenangan, dan menutup loop dengan bukti.']};const entries=Object.entries(r).sort((a,b)=>Number(a[0])-Number(b[0]));return `<div class="rubric-grid">${entries.map(([score,val])=>{const meta=labels[Number(score)]||[];const title=typeof val==='string'?val:(val?.label||val?.level||'Level penilaian');const desc=typeof val==='object'?(val.description||val.behavior||meta[1]||''):meta[1]||'Gunakan perilaku dan bukti yang tercatat untuk menentukan level ini.';return `<div class="rubric-band"><strong>${esc(score)}<small style="font-size:12px">/100</small></strong><b>${esc(title||meta[0]||'Level')}</b><div class="small muted">${esc(desc)}</div></div>`}).join('')}</div><div class="small muted" style="margin-top:8px">Nilai harus didasarkan pada perilaku yang dapat diamati dan evidence, bukan kesan pribadi.</div>`}

async function participantAssessmentPage(){
 if(!state.participant) return `<div class="card"><h2>Assessment belum tersedia</h2><p class="muted">Data participant belum terhubung ke akun ini.</p></div>`;
 const localItems=V7_BASELINE_SJT;
 const {data:existing,error:ae}=await sb.from("assessments").select("id,status,completed_at,assessment_type,stage").eq("participant_id",state.participant.id).eq("assessment_type","sjt").eq("stage","baseline").order("created_at",{ascending:false}).limit(1);
 if(ae) throw ae;
 let assessment=existing?.[0];
 if(assessment && !assessment.completed_at){
   const {count:savedCount,error:se}=await sb.from("assessment_responses").select("id",{count:"exact",head:true}).eq("assessment_id",assessment.id);
   if(se)throw se;
   if((savedCount||0)>=17) return `<h2>Assessment Awal</h2><div class="card"><h3>Jawaban assessment sudah tersimpan</h3><p>Assessment lama memiliki ${savedCount} jawaban tersimpan, tetapi proses hasilnya belum selesai.</p>${actionBtn("Proses hasil assessment","reprocessBaselineAssessment('"+assessment.id+"')","primary")}</div>`;
 }
 if(assessment?.completed_at){
   const {data:p,error:pe}=await sb.from("competency_profiles").select("calculated_score,competencies(code,name)").eq("participant_id",state.participant.id).order("calculated_score",{ascending:false}).limit(3);
   if(pe)throw pe;
   const {count:evidenceCount,error:ee}=await sb.from("evidence").select("id",{count:"exact",head:true}).eq("participant_id",state.participant.id).eq("source_type","assessment").eq("source_id",assessment.id);
   if(ee)throw ee;
   const missingResults=!p?.length || !evidenceCount;
   return `<h2>Assessment Awal</h2><div class="card"><h3>Assessment sudah selesai</h3><p>Jawaban assessment sudah tercatat. Hasil kompetensi dan learning path perlu disinkronkan jika assessment dilakukan sebelum engine terbaru dipasang.</p><div class="notice"><b>Readiness belum otomatis dinyatakan siap kerja.</b> Evidence praktik dan validasi mentor tetap dibutuhkan.</div>${missingResults?`<div class="error" style="margin-top:14px">Hasil turunan untuk assessment ini belum terbentuk.</div><div style="margin-top:14px">${actionBtn("Proses hasil assessment","reprocessBaselineAssessment('"+assessment.id+"')","primary")}</div>`:`<h3 style="margin-top:16px">Strength awal</h3>${p.map(x=>`<div class="list-item"><b>${esc(x.competencies?.name||'—')}</b><span class="small muted">Baseline ${esc(x.calculated_score)}</span></div>`).join('')}`}<div style="margin-top:14px">${actionBtn("My Learning Path","go('learning')","ghost")}</div></div>`;
 }
 if(!assessment){
   const ins=await sb.from("assessments").insert({participant_id:state.participant.id,assessment_type:"sjt",stage:"baseline",started_at:new Date().toISOString(),status:"draft"}).select("id,status").single();
   if(ins.error) throw ins.error; assessment=ins.data;
 }
 const draftKey=`workforce_assessment_draft_${assessment.id}`;let draft={};try{draft=JSON.parse(localStorage.getItem(draftKey)||"{}")||{}}catch(_){draft={}};
 const completeCount=localItems.filter(x=>{const d=draft[x.question_code]||{};return d.choice&&String(d.reason||'').trim()}).length;
 return `<div class="toolbar"><div><h2 style="margin:0">Assessment Awal</h2><div class="small muted">Baseline — 17 SJT — pilihan tindakan + alasan</div></div><span class="pill info">${localItems.length} pertanyaan</span></div>
 <div class="notice"><b>Pilih satu tindakan yang paling tepat.</b> Setelah memilih, jelaskan alasanmu. Pilihan mengukur keputusan; alasan menjadi evidence tambahan tentang cara berpikirmu.</div>
 <div class="card"><div class="small muted">Progress: <b id="assessProgress">${completeCount}/${localItems.length}</b></div>
 ${localItems.map((x,i)=>{const d=draft[x.question_code]||{};return `<div class="card assessment-question" style="margin-top:14px;border:1px solid var(--line);box-shadow:none"><div class="small muted">${i+1}. ${esc(x.question_code)} — ${esc(x.competency)} — ${esc(x.difficulty)}</div><h3 style="margin:8px 0">${esc(x.question)}</h3><div class="notice"><b>Situasi:</b> ${esc(x.scenario)}</div><div style="margin-top:12px"><b>Pilih tindakan:</b></div><div class="sjt-options" data-code="${esc(x.question_code)}">${x.choices.map((o,j)=>{const val=String.fromCharCode(65+j);return `<label class="sjt-option"><input type="radio" name="choice_${esc(x.question_code)}" value="${val}" ${d.choice===val?'checked':''} onchange="saveAssessmentChoice('${assessment.id}','${esc(x.question_code)}','${val}')"><span><b>${val}.</b> ${esc(o.label)}</span></label>`}).join('')}</div><label style="display:block;margin-top:14px"><b>Kenapa memilih tindakan tersebut?</b></label><textarea class="assess-reason" data-code="${esc(x.question_code)}" rows="4" minlength="10" placeholder="Minimal 10 karakter. Jelaskan alasan, risiko yang dipertimbangkan, dan kapan kamu berhenti/eskalasi." oninput="saveAssessmentReason('${assessment.id}',this)">${esc(d.reason||'')}</textarea><div class="assessment-validation">Minimal 10 karakter untuk setiap alasan jawaban.</div></div>`}).join('')}
 <div style="margin-top:16px">${actionBtn("Kirim Assessment","submitParticipantAssessment('"+assessment.id+"')","primary")}</div></div>`;
}
function getAssessmentDraft(assessmentId){try{return JSON.parse(localStorage.getItem(`workforce_assessment_draft_${assessmentId}`)||"{}")||{}}catch(_){return {}}}
function setAssessmentDraft(assessmentId,draft){try{localStorage.setItem(`workforce_assessment_draft_${assessmentId}`,JSON.stringify(draft))}catch(_){}
}
function updateAssessmentProgress(assessmentId){const d=getAssessmentDraft(assessmentId);const n=V7_BASELINE_SJT.filter(x=>d[x.question_code]?.choice&&String(d[x.question_code]?.reason||'').trim().length>=10).length;const p=document.getElementById('assessProgress');if(p)p.textContent=`${n}/17`}
function saveAssessmentChoice(assessmentId,code,val){const d=getAssessmentDraft(assessmentId);d[code]=d[code]||{};d[code].choice=val;const q=V7_BASELINE_SJT.find(x=>x.question_code===code);d[code].score=q?.choices?.[val.charCodeAt(0)-65]?.score||0;setAssessmentDraft(assessmentId,d);updateAssessmentProgress(assessmentId)}
function saveAssessmentReason(assessmentId,el){const d=getAssessmentDraft(assessmentId);d[el.dataset.code]=d[el.dataset.code]||{};d[el.dataset.code].reason=el.value;setAssessmentDraft(assessmentId,d);updateAssessmentProgress(assessmentId)}
let baselineSubmitInFlight=false;
async function submitParticipantAssessment(assessmentId){
 if(baselineSubmitInFlight){toast("Assessment sedang dikirim. Tunggu sampai proses selesai.",true);return;}
 try{
   const draft=getAssessmentDraft(assessmentId);const incomplete=V7_BASELINE_SJT.filter(x=>!draft[x.question_code]?.choice||String(draft[x.question_code]?.reason||'').trim().length<10);
   if(incomplete.length){const shortReasons=incomplete.filter(x=>draft[x.question_code]?.choice&&String(draft[x.question_code]?.reason||'').trim().length>0&&String(draft[x.question_code]?.reason||'').trim().length<10).length;toast(shortReasons?`Ada ${shortReasons} alasan yang kurang dari 10 karakter. Lengkapi semua 17 pertanyaan.`:`Masih ada ${incomplete.length} pertanyaan yang belum lengkap.`,true);const first=incomplete[0];document.querySelector(`[data-code="${first.question_code}"].assess-reason`)?.focus();return;}
   baselineSubmitInFlight=true;
   const buttons=[...document.querySelectorAll("button")];buttons.forEach(b=>{if(b.textContent.includes("Kirim Assessment")){b.disabled=true;b.textContent="Mengirim assessment...";}});
   const expectedCodes=V7_BASELINE_SJT.map(x=>x.question_code);
   if(expectedCodes.length!==17 || new Set(expectedCodes).size!==17){throw new Error('Konfigurasi baseline tidak valid: kode soal harus unik dan berjumlah 17.');}
   const answers=V7_BASELINE_SJT.map(x=>({question_code:x.question_code,choice:draft[x.question_code].choice,reason:String(draft[x.question_code].reason).trim()}));
   if(answers.length!==17 || new Set(answers.map(x=>x.question_code)).size!==17){throw new Error('Jawaban baseline tidak valid: harus 17 kode unik.');}
   // Scores are always derived from the database rubric by the server-side RPC.
   const {data,error}=await sb.rpc('submit_baseline_assessment',{p_assessment_id:assessmentId,p_answers:answers});
   if(error) throw error;
   try{localStorage.removeItem(`workforce_assessment_draft_${assessmentId}`)}catch(_){ }
   toast(`Assessment selesai — ${data?.courses_assigned||0} course, ${data?.missions_assigned||0} mission, ${data?.simulations_assigned||0} simulation.`);
   go('learning');
 }catch(e){toast("Assessment belum berhasil disimpan: "+errText(e),true)}
 finally{baselineSubmitInFlight=false;document.querySelectorAll("button").forEach(b=>{if(b.textContent.includes("Mengirim assessment")){b.disabled=false;b.textContent="Kirim Assessment";}});}
}

async function reprocessBaselineAssessment(assessmentId){
 try{
  const {data,error}=await sb.rpc("reprocess_baseline_assessment",{p_assessment_id:assessmentId});
  if(error)throw error;
  toast("Hasil assessment berhasil disinkronkan.");
  await loadProfile();
  render();
 }catch(e){toast("Hasil belum dapat diproses: "+errText(e),true)}
}

function openAssessmentForm(){modal("Assessment Item",`<div class="notice">Isi rubrik dengan bahasa perilaku yang mudah dipakai penilai. Sistem akan menyimpannya sebagai data dan menampilkannya sebagai kartu level—tidak perlu menulis kode JSON.</div><div class="two"><div><label>Question Code</label><input id="aiCode"></div><div><label>Type</label><select id="aiType"><option>knowledge</option><option>sjt</option><option>behavioral</option><option>engineering_case</option><option>simulation</option><option>mixed</option></select></div><div><label>Difficulty</label><input id="aiDiff" value="intermediate"></div><div><label>Question</label><input id="aiQ"></div></div><label>Scenario</label><textarea id="aiScenario"></textarea><label>Expected Behavior</label><textarea id="aiExpected"></textarea><label>Red Flag</label><textarea id="aiRed"></textarea><h3 style="margin-top:16px">Scoring Rubric</h3><div class="two"><div><label>0 — Kritis</label><textarea id="rub0" placeholder="Perilaku tidak aman / tidak sesuai standar"></textarea></div><div><label>50 — Berkembang</label><textarea id="rub50" placeholder="Mengenali sebagian masalah, tetapi belum konsisten"></textarea></div><div><label>70 — Fungsional</label><textarea id="rub70" placeholder="Langkah cukup tepat, aman, dan beralasan"></textarea></div><div><label>85 — Kuat</label><textarea id="rub85" placeholder="Sistematis, evidence-based, dan follow-up"></textarea></div><div><label>100 — Unggul</label><textarea id="rub100" placeholder="Antisipatif, terukur, menutup loop dengan bukti"></textarea></div></div>`,actionBtn("Simpan","createAssessment()","primary")+actionBtn("Batal","closeModal()","ghost"))}
async function createAssessment(){try{const rubric={0:document.getElementById('rub0').value.trim()||'Respons kritis; perlu pembinaan dan demonstrasi ulang.',50:document.getElementById('rub50').value.trim()||'Mulai memahami, tetapi analisis/tindakan belum konsisten.',70:document.getElementById('rub70').value.trim()||'Memenuhi standar dasar dengan tindakan aman dan alasan yang cukup.',85:document.getElementById('rub85').value.trim()||'Menunjukkan analisis sistematis, komunikasi, dan tindak lanjut.',100:document.getElementById('rub100').value.trim()||'Antisipatif, menghubungkan dampak lanjutan, dan membuktikan hasil.'};await db(sb.from("assessment_items").insert({question_code:document.getElementById("aiCode").value.trim(),type:document.getElementById("aiType").value,difficulty:document.getElementById("aiDiff").value.trim(),question:document.getElementById("aiQ").value.trim(),scenario:document.getElementById("aiScenario").value.trim()||null,expected_behavior:document.getElementById("aiExpected").value.trim()||null,red_flag:document.getElementById("aiRed").value.trim()||null,scoring_rubric:rubric,created_by:state.profile.id}),"Assessment");closeModal();toast("Assessment item tersimpan");go("assessment")}catch(e){toast(errText(e),true)}}

}
function visualLearningExperienceV14Base(course,modules){
 const safeName=esc(course.name||'Course');
 const firstTitle=esc(modules?.[0]?.[0]||'Konsep utama');
 const firstText=esc(modules?.[0]?.[1]||'Mulai dari memahami tujuan, konteks, dan batas kewenangan.');
 const key=String(course.course_code||'').toUpperCase();
 const stage=/CRS-003/.test(key)?[['Tujuan','Pahami outcome'],['Celah','Cari yang belum tuntas'],['Tindak lanjut','Tetapkan pemilik'],['Verifikasi','Pastikan hasil']]:/CRS-004/.test(key)?[['Gejala','Rumuskan masalah'],['Hipotesis','Cari bukti'],['Uji','Pilih pemeriksaan aman'],['Verifikasi','Cek akar penyebab']]:/CRS-010/.test(key)?[['Pause','Hentikan reaksi impulsif'],['Assess','Nilai fakta dan risiko'],['Act','Tindakan berwenang'],['Review','Verifikasi hasil']]:/CRS-002/.test(key)?[['Catat','Ambil data aktual'],['Bandingkan','Actual vs target'],['Laporkan','Pisahkan fakta dan dugaan'],['Koreksi','Jaga jejak perubahan']]:/CRS-007|CRS-008/.test(key)?[['Dengar','Pahami situasi'],['Fakta','Pisahkan opini'],['Sampaikan','Jelaskan dampak'],['Sepakati','Tentukan tindak lanjut']]:/CRS-009/.test(key)?[['Amati','Catat gejala'],['Analisis','Bandingkan kondisi'],['Tindakan','Sesuai SOP'],['Verifikasi','Cek hasil']]:[['Pahami','Definisikan masalah'],['Analisis','Periksa fakta dan risiko'],['Terapkan','Pilih langkah tepat'],['Verifikasi','Pastikan hasil']];
 const choices=/CRS-003/.test(key)?[['observe','Menutup pekerjaan setelah aktivitas dilakukan, meski hasil belum dicek.'],['secure','Memastikan hasil sesuai kriteria, mencatat bukti, dan memberi handover.'],['ask','Mengambil alih semua keputusan tanpa mengonfirmasi kewenangan.']]:/CRS-010/.test(key)?[['observe','Langsung melakukan restart agar target cepat pulih.'],['secure','Menilai keselamatan dan kondisi aktual sebelum memilih tindakan yang diizinkan.'],['ask','Menunggu tanpa mengamankan area atau menyampaikan status.']]:[['observe','Membandingkan bukti dan kondisi aktual sebelum menyimpulkan.'],['secure','Mengendalikan risiko yang nyata sesuai prosedur.'],['ask','Meminta bantuan pihak berwenang ketika informasi atau kewenangan belum cukup.']];
 return `<section class="visual-learning" id="visualLearningExperience"><div class="visual-learning-head"><div><h3>Visual Learning Studio</h3><p>Visual, langkah, dan latihan disesuaikan dengan kompetensi course ini.</p></div><span class="learning-tag">✦ Belajar aktif</span></div><div class="visual-tabs"><button class="visual-tab active" id="vlTabVisual" onclick="switchVisualLesson('visual')">① Peta konsep</button><button class="visual-tab" id="vlTabSteps" onclick="switchVisualLesson('steps')">② Alur penerapan</button><button class="visual-tab" id="vlTabSim" onclick="switchVisualLesson('simulation')">③ Coba simulasi</button></div><div class="visual-panel" id="vlPanelVisual"><div class="visual-canvas"><div style="font-size:11px;color:#748681;margin-bottom:12px">PETA BELAJAR · ${safeName}</div><div class="visual-flow">${stage.map((x,i)=>`<div class="visual-node"><div class="visual-node-icon">${['◎','◇','⚙','✓'][i]}</div><b>${esc(x[0])}</b><small>${esc(x[1])}</small></div>`).join('')}</div></div><div class="visual-callout"><b>Fokus course:</b> ${firstTitle}<br><span>${firstText}</span></div></div><div class="visual-panel" id="vlPanelSteps" style="display:none"><div class="visual-canvas"><div style="font-size:11px;color:#748681;margin-bottom:10px">URUTAN PENERAPAN</div><div class="list">${stage.map((x,i)=>`<div class="list-item"><b>0${i+1} · ${esc(x[0])}</b><div class="small muted">${esc(x[1])}</div></div>`).join('')}</div></div><div class="visual-callout"><b>Hubungkan dengan materi:</b> ${firstTitle}. Gunakan penjelasan setiap bagian untuk memahami alasan di balik urutan ini.</div></div><div class="visual-panel" id="vlPanelSimulation" style="display:none"><div class="visual-canvas"><div class="pill info">LATIHAN KEPUTUSAN</div><h4 style="margin:10px 0 6px">${esc(course.scenario||`Kamu menghadapi situasi yang berkaitan dengan ${course.name||'kompetensi ini'}.`)}</h4><p class="small muted">Pilih respons yang paling mendekati tindakanmu. Perhatikan alasan dan batas kewenangan, bukan hanya label pilihan.</p>${choices.map((x,i)=>`<button class="simulation-choice" onclick="evaluateVisualChoice('${x[0]}')"><span class="choice-key">${String.fromCharCode(65+i)}</span><span>${esc(x[1])}</span></button>`).join('')}<div id="vlSimulationFeedback" aria-live="polite"></div></div></div></section>`;
}
function switchVisualLesson(mode){const ids={visual:'vlPanelVisual',steps:'vlPanelSteps',simulation:'vlPanelSimulation'};Object.entries(ids).forEach(([k,id])=>{const el=document.getElementById(id);if(el)el.style.display=k===mode?'block':'none';const tab=document.getElementById({visual:'vlTabVisual',steps:'vlTabSteps',simulation:'vlTabSim'}[k]);if(tab)tab.classList.toggle('active',k===mode)});}
function evaluateVisualChoice(choice){const el=document.getElementById('vlSimulationFeedback');if(!el)return;const messages={observe:['Periksa alasan keputusan','Bandingkan bukti yang tersedia dengan kondisi aktual. Jangan menyimpulkan penyebab tanpa data; tetap periksa risiko sesuai konteks course.'],secure:['Tindakan proporsional','Kendalikan risiko yang nyata sesuai SOP dan kewenangan. Setelah kondisi terkendali, lanjutkan analisis dan verifikasi hasil.'],ask:['Kolaborasi dan batas kewenangan','Eskalasi ketika risiko, informasi, atau kewenangan menuntutnya. Sampaikan fakta, tindakan yang sudah dilakukan, dan keputusan yang dibutuhkan.']};const m=messages[choice]||messages.observe;el.className='simulation-feedback';el.innerHTML='<b>'+m[0]+'</b><br>'+m[1]+'<div class="small" style="margin-top:7px;color:#688079">Refleksi: tindakan apa yang akan kamu lakukan setelah langkah ini?</div>';}
async function openCoursePreview(courseId,name){try{const c=await db(sb.from('courses').select('*').eq('id',courseId).single(),'Detail course');const title=(c.name||name||'').toLowerCase();let modules=[];if(/safety|compliance|hazard/.test(title)){modules=[['Apa itu kondisi abnormal?','Kondisi aktual yang menyimpang dari kondisi normal/SOP, misalnya suara mesin berubah, getaran meningkat, temperatur naik, guard longgar, kebocoran, atau hasil inspeksi di luar batas. Abnormal bukan berarti langsung tahu penyebabnya; itu adalah sinyal untuk berhenti sejenak, memeriksa fakta, dan menilai risiko.'],['Contoh nyata di maintenance','Saat inspeksi mesin weaving, mekanik mendengar suara gesekan baru pada area transmisi. Jangan langsung mengencangkan atau membongkar komponen saat mesin bergerak. Ikuti SOP isolasi energi/LOTO yang berlaku, amankan area, catat lokasi dan kondisi, lalu eskalasi jika tindakan melewati kewenangan.'],['Alur tindakan aman','Amati gejala → amankan orang dan area → verifikasi sesuai SOP dan kewenangan → catat fakta → laporkan/escalate → pastikan tindak lanjut dan status akhir tercatat.'],['Kesalahan yang harus dihindari','Menganggap suara abnormal sebagai hal biasa, mengubah setelan tanpa izin, menonaktifkan guard, atau melaporkan “normal” tanpa pemeriksaan.']]}else if(/integrity|data/.test(title)){modules=[['Actual vs target','Actual adalah hasil yang benar-benar terukur; target adalah sasaran. Keduanya tidak boleh dicampur untuk membuat laporan terlihat baik.'],['Contoh nyata','Target mesin 95%, hasil aktual 87%. Laporkan 87%, waktu kejadian, kondisi, dan bukti. Catat penyebab sebagai hipotesis sampai didukung data.'],['Cara menyampaikan','Sampaikan fakta, dampak, tindakan sementara, bantuan yang dibutuhkan, dan waktu pembaruan berikutnya.'],['Kesalahan umum','Mengubah angka, menghilangkan kejadian, atau menyalahkan departemen lain tanpa verifikasi.']]}else if(/root cause|problem solving/.test(title)){modules=[['Gejala bukan akar penyebab','Mesin berhenti adalah gejala. Penyebab harus dibuktikan melalui inspeksi, riwayat gangguan, pengukuran, dan kondisi saat kejadian.'],['Contoh 5 Why','Benang sering putus → tegangan tidak stabil → mekanisme pengatur tersendat → ditemukan kontaminasi/keausan → penyebab diverifikasi dengan inspeksi sesuai SOP. Ini contoh latihan, bukan diagnosis untuk semua mesin.'],['Containment vs corrective action','Containment mengurangi risiko saat ini; corrective action memperbaiki penyebab yang sudah diverifikasi. Jangan menganggap perbaikan sementara sebagai penyelesaian permanen.'],['Verifikasi','Bandingkan kondisi sebelum/sesudah, pantau hasil, catat bukti, dan pastikan masalah tidak berulang.']]}else if(/communication|conflict/.test(title)){modules=[['Komunikasi terstruktur','Gunakan situasi, fakta, dampak, tindakan yang sudah dilakukan, dan kebutuhan/keputusan yang diminta. Hindari asumsi dan serangan personal.'],['Contoh nyata lintas departemen','Persiapan melaporkan variasi kondisi benang yang berpotensi memengaruhi weaving. Sampaikan data lot, waktu, mesin terkait, bukti, dan tindakan containment; sepakati siapa melakukan verifikasi dan kapan update.'],['Jika berbeda pendapat','Pisahkan orang dari masalah, kembali ke data, jelaskan risiko, dan eskalasi sesuai jalur jika risiko belum terkendali.']]}else{modules=[['Konsep inti','Materi ini melatih peserta menerjemahkan prinsip kerja menjadi perilaku yang dapat diamati. Baca instruksi/SOP setempat terlebih dahulu dan pahami batas kewenangan.'],['Contoh di tempat kerja','Ketika menemukan kondisi yang tidak sesuai, catat apa yang dilihat/diukur, kapan dan di mana terjadi, dampak potensial, tindakan aman yang dilakukan, serta siapa yang diberi tahu. Jangan menebak penyebab tanpa bukti.'],['Langkah penerapan','Pahami standar → amati kondisi → bandingkan dengan standar → nilai risiko → bertindak sesuai kewenangan → komunikasikan → verifikasi tindak lanjut.'],['Contoh keputusan yang baik','Memilih tindakan yang aman, melaporkan fakta secara jujur, meminta bantuan pada titik yang tepat, dan memastikan masalah tidak hilang hanya karena laporan sudah dikirim.'],['Kesalahan yang harus dihindari','Melompati SOP, bertindak di luar kewenangan, menutupi ketidakpastian, atau berhenti setelah melakukan tugas tanpa memastikan hasilnya.']]};const extra=String(c.content||'').trim();modal('Materi course · '+(c.name||name),`<div class="notice"><b>${esc(c.course_code||'COURSE')}</b> · ${esc(c.difficulty||'foundation')} · ${esc(c.duration_minutes||60)} menit<br>${esc(c.description||'Tujuan pembelajaran dan penerapan kerja.')}</div>${c.scenario?`<section class="course-module"><div class="pill info">Skenario khusus course</div><h4>Situasi yang harus dianalisis</h4><p style="white-space:pre-wrap">${esc(c.scenario)}</p></section>`:''}${Array.isArray(c.learning_outcomes)&&c.learning_outcomes.length?`<section class="course-module"><h4>Target hasil belajar</h4><ul>${c.learning_outcomes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`:''}${visualLearningExperience(c,modules)}${modules.map((m,i)=>`<section class="course-module"><div class="pill info">Bagian ${i+1}</div><h4>${esc(m[0])}</h4><p style="white-space:pre-wrap;color:var(--text)">${esc(m[1])}</p></section>`).join('')}${extra?`<details class="course-module"><summary>Materi tambahan dari pembuat course</summary><p style="white-space:pre-wrap">${esc(extra)}</p></details>`:''}<div class="notice"><b>Catatan praktik:</b> contoh ini untuk pembelajaran. Prosedur keselamatan, LOTO, standar mutu, dan instruksi perusahaan yang berlaku tetap menjadi acuan utama.</div>`,actionBtn('Tutup','closeModal()','ghost'))}catch(e){toast(errText(e),true)}}
async function openCourseForm(){const comps=await db(sb.from('competencies').select('id,code,name,domain').order('code'),'Daftar kompetensi');modal('Course Builder',`<div class="notice">Buat materi yang bisa dipakai ulang. Course baru tersimpan sebagai draft; publikasikan setelah diperiksa agar bisa ditugaskan.</div><label>Course Code</label><input id="coCode" placeholder="CRS-013"><label>Nama Course</label><input id="coName" placeholder="Contoh: Basic Machine Inspection"><label>Deskripsi / tujuan</label><textarea id="coDesc" placeholder="Kompetensi apa yang dibangun?"></textarea><label>Materi pembelajaran</label><textarea id="coContent" placeholder="Konsep, SOP, langkah praktik, contoh, dan hal yang tidak boleh dilakukan..."></textarea><label>Skenario khusus course</label><textarea id="coScenario" placeholder="Kasus nyata/realistis yang hanya berlaku untuk course ini, kondisi awal, kendala, dan informasi yang tersedia..."></textarea><label>Target hasil belajar</label><textarea id="coOutcomes" placeholder="Setelah course, peserta mampu... (satu target per baris)"></textarea><div class="two"><div><label>Durasi (menit)</label><input id="coDur" type="number" min="5" value="60"></div><div><label>Level</label><select id="coDiff"><option>foundation</option><option>basic</option><option>intermediate</option><option>advanced</option><option>application</option><option>operational</option></select></div></div><label>Pemetaan kompetensi (pilih minimal satu)</label><div class="competency-picks">${comps.map(c=>`<label class="sjt-option"><input type="checkbox" name="coCompetency" value="${c.id}"><span><b>${esc(c.code)}</b> — ${esc(c.name)}<small class="muted" style="display:block">${esc(c.domain||'')}</small></span></label>`).join('')}</div>`,actionBtn('Simpan Draft','createCourse()','primary')+actionBtn('Batal','closeModal()','ghost'))}
async function ensureDefaultCourseQuiz(courseId,courseName,description,content,difficulty,createdBy){
 const existing=await db(sb.from('course_quiz_questions').select('id').eq('course_id',courseId),'Periksa kuis course');if(existing.length)return {created:0,existing:existing.length};
 const level=String(difficulty||'foundation').toLowerCase();const focus=(String(description||'')+' '+String(content||'')).trim().replace(/\s+/g,' ').slice(0,180)||`konsep, prosedur, risiko, dan tindak lanjut ${courseName}`;
 const base=[
  {q:`Apa tujuan utama course "${courseName}"?`,o:['Menerapkan prinsip materi dengan aman dan konsisten','Menyelesaikan tugas secepat mungkin tanpa verifikasi','Mengikuti kebiasaan tanpa mengecek standar','Menghindari komunikasi ketika ada masalah'],e:'Tujuan belajar adalah menerapkan prinsip secara aman, sesuai standar, dan dapat dijelaskan.'},
  {q:`Sebelum menerapkan materi ${courseName}, apa yang perlu dilakukan?`,o:['Memahami kondisi, tujuan, dan fakta yang tersedia','Langsung mengubah proses tanpa pemeriksaan','Menganggap dugaan sebagai penyebab pasti','Menunggu sampai masalah membesar'],e:'Pemahaman konteks dan fakta membantu mencegah kesimpulan prematur.'},
  {q:`Materi course berkaitan dengan ${focus}. Mengapa standar/SOP perlu diperiksa?`,o:['Agar tindakan aman, konsisten, dan sesuai kewenangan','Agar prosedur bisa dilewati saat sibuk','Agar keputusan hanya berdasarkan perkiraan','Agar dokumentasi tidak perlu dibuat'],e:'SOP menjadi acuan tindakan dan batas kewenangan.'},
  {q:`Jika hasil aktual berbeda dari harapan saat menerapkan ${courseName}, apa langkah yang tepat?`,o:['Catat hasil aktual, nilai risiko, lalu verifikasi penyebab','Ubah data agar sesuai target','Sembunyikan hasil yang tidak sesuai','Langsung menyalahkan pihak lain'],e:'Data aktual harus dijaga dan penyebab perlu diverifikasi.'},
  {q:`Apa bukti bahwa peserta memahami materi ${courseName}?`,o:['Mampu menjelaskan alasan tindakan, risiko, dan hasil verifikasi','Hanya mengatakan tugas selesai tanpa penjelasan','Meniru langkah tanpa memahami risikonya','Mengabaikan tindak lanjut setelah tindakan awal'],e:'Pemahaman perlu terlihat melalui alasan, risiko, dan bukti hasil.'},
  {q:`Pada level ${level}, jika informasi belum lengkap, pendekatan yang baik adalah…`,o:['Memisahkan fakta dan asumsi, memeriksa dengan aman, lalu meminta bantuan bila perlu','Mengisi informasi yang hilang dengan tebakan','Mengambil tindakan berisiko demi kecepatan','Melaporkan kesimpulan tanpa menyebut ketidakpastian'],e:'Ketidakpastian harus diakui dan ditangani sesuai risiko serta kewenangan.'},
  {q:`Kesalahan apa yang perlu dihindari saat menjalankan materi ${courseName}?`,o:['Melompati SOP atau bertindak di luar kewenangan','Mencatat kondisi aktual','Memastikan risiko terkendali','Mengomunikasikan temuan secara faktual'],e:'Keselamatan, standar, dan batas kewenangan tidak boleh dilewati.'},
  {q:`Jika masalah melibatkan departemen lain, komunikasi yang paling berguna berisi…`,o:['Fakta, dampak, tindakan sementara, dan bantuan yang diperlukan','Tuduhan tanpa bukti','Dugaan yang belum diverifikasi','Informasi yang ditahan sampai target terlewat'],e:'Komunikasi terstruktur membantu pihak terkait memahami kondisi dan kebutuhan.'},
  {q:`Bagaimana memeriksa efektivitas tindakan setelah mempelajari ${courseName}?`,o:['Bandingkan kondisi sebelum dan sesudah, lalu dokumentasikan hasil','Anggap selesai begitu tindakan dilakukan','Lewati pemeriksaan jika kondisi terlihat normal','Hapus catatan agar laporan lebih ringkas'],e:'Verifikasi memastikan hasil, bukan sekadar aktivitas, sudah tercapai.'},
  {q:`Apa contoh ownership ketika menerapkan materi ${courseName}?`,o:['Menuntaskan tindak lanjut dan memastikan status akhir tercatat','Berhenti setelah mengirim pesan pertama','Menyerahkan masalah tanpa konteks','Menunggu orang lain menanyakan perkembangan'],e:'Ownership mencakup tindak lanjut dan penutupan loop dalam batas kewenangan.'}
 ];
 const rows=base.map((x,i)=>{const opts=[...x.o.slice(1)];opts.splice(i%4,0,x.o[0]);return {course_id:courseId,question:x.q,options:opts,correct_option:String.fromCharCode(65+(i%4)),explanation:x.e,sort_order:i+1,created_by:createdBy,is_active:true}});
 const {error}=await sb.from('course_quiz_questions').insert(rows);if(error)throw error;return {created:rows.length,existing:0};
}
async function createCourse(){try{const code=document.getElementById('coCode').value.trim(),name=document.getElementById('coName').value.trim(),description=document.getElementById('coDesc').value.trim(),content=document.getElementById('coContent').value.trim(),scenario=document.getElementById('coScenario').value.trim(),outcomes=document.getElementById('coOutcomes').value.trim(),difficulty=document.getElementById('coDiff').value,competencyIds=[...document.querySelectorAll('input[name=coCompetency]:checked')].map(x=>x.value);if(!code||!name)throw new Error('Kode dan nama course wajib diisi.');if(!competencyIds.length)throw new Error('Pilih minimal satu kompetensi agar course dapat dipetakan ke learning path.');if(!scenario)throw new Error('Skenario khusus wajib diisi agar kasus tidak sama untuk semua course.');if(!outcomes)throw new Error('Isi minimal satu target hasil belajar.');const course=await db(sb.from('courses').insert({course_code:code,name,description:description||null,content:content||null,scenario,learning_outcomes:outcomes.split('\n').map(x=>x.trim()).filter(Boolean),duration_minutes:Number(document.getElementById('coDur').value)||60,difficulty,created_by:state.profile.id,status:'draft'}).select('id').single(),'Simpan course');const weight=Math.floor(100/competencyIds.length);const links=competencyIds.map((competency_id,i)=>({course_id:course.id,competency_id,relationship:i===0?'primary':'secondary',weight:i===competencyIds.length-1?100-weight*(competencyIds.length-1):weight}));const {error:me}=await sb.from('course_competencies').insert(links);if(me)throw new Error('Course tersimpan sebagai draft, tetapi pemetaan kompetensi gagal: '+me.message);let quizNote='';try{const quiz=await ensureDefaultCourseQuiz(course.id,name,description,content+'\nSkenario: '+scenario+'\nTarget: '+outcomes,difficulty,state.profile.id);quizNote=quiz.created?` ${quiz.created} soal kuis awal ditambahkan. Periksa dan sesuaikan dengan skenario serta target course.`:' Kuis yang sudah ada dipertahankan.'}catch(qe){quizNote=' Course tersimpan, tetapi kuis otomatis gagal dibuat: '+errText(qe)+'. Kamu dapat mencoba dari Kelola kuis.'}closeModal();toast('Course tersimpan sebagai draft dengan skenario dan target khusus.'+quizNote);go('courses')}catch(e){toast(errText(e),true)}}

async function simulationsPage(){
 const isParticipant=state.profile.role==='participant';
 let q=sb.from('simulations').select('*').order('created_at',{ascending:false});

 const quizPct=courseRows.length?Math.round(courseRows.reduce((sum,a)=>sum+(pmap.get(a.id)?.quiz_score==null?0:Math.max(0,Math.min(100,Number(pmap.get(a.id).quiz_score)||0))),0)/courseRows.length):0;
 return `<div class="hero-strip"><div class="small" style="color:#b7e5df;font-weight:800;letter-spacing:.08em">PERSONAL DEVELOPMENT</div><h2 style="color:#fff;margin:5px 0">My Learning Path</h2><p>Pelajari materi interaktif, kerjakan kuis, lalu kirim catatan bukti kerja. Foto opsional sesuai jenis aktivitas.</p><div class="chart-pair"><div class="chart-card"><div class="small muted">PROGRES SELURUH AKTIVITAS</div><div style="display:flex;justify-content:space-between;gap:10px;margin:8px 0"><b>${complete} dari ${rows.length} disetujui</b><b>${activityPct}%</b></div><div class="progress-track"><span style="width:${activityPct}%"></span></div></div><div class="chart-card"><div class="small muted">PROGRES MATERI & KUIS</div><div style="display:flex;justify-content:space-between;gap:10px;margin:8px 0"><b>Rata-rata progres materi</b><b>${lessonPct}%</b></div><div class="progress-track"><span style="width:${lessonPct}%"></span></div><div style="display:flex;justify-content:space-between;gap:10px;margin:12px 0 8px"><b>Rata-rata nilai kuis</b><b>${quizPct}%</b></div><div class="progress-track"><span style="width:${quizPct}%;background:linear-gradient(90deg,#7c3aed,#38bdf8)"></span></div><div class="small muted" style="margin-top:8px">Grafik memakai lesson_progress dan quiz_score yang tersimpan untuk tiap course; course tanpa progres dihitung 0%.</div></div></div></div>
 <div class="toolbar"><div><h3 style="margin:0">Aktivitas saya</h3><div class="small muted">Progres aktivitas bertambah setelah mentor menyetujui evidence.</div></div><span class="pill info">${rows.length} aktivitas</span></div>
 <div class="activity-grid">${rows.map(x=>{const a=map.get(x.activity_id)||{};const sub=latest.get(x.id);const pr=pmap.get(x.id);const name=a.name||x.activity_type;const code=a.course_code||a.mission_code||a.simulation_code||x.activity_id;const desc=a.description||a.scenario||'Aktivitas pengembangan yang ditetapkan mentor atau engine.';return `<article class="activity-card"><div class="activity-meta"><span class="pill info">${esc(x.activity_type.toUpperCase())}</span>${pill(sub?.status||x.status)}<span class="pill">Prioritas ${esc(x.priority||1)}</span></div><div class="activity-code">${esc(code)}</div><h3>${esc(name)}</h3><p>${esc(desc)}</p><div class="small muted">Tenggat: ${fmtDate(x.due_date)} · ${esc(a.difficulty||'')}</div>
 ${x.activity_type==='course'?`<div class="submission-box"><b>Progres course</b><div class="small muted">Materi: ${pr?.lesson_completed?'Selesai':'Belum selesai'} · Kuis: ${pr?.quiz_passed?'Lulus':pr?.quiz_score!=null?'Belum lulus':'Belum dikerjakan'}${pr?.quiz_score!=null?' · Nilai '+pr.quiz_score+'%':''}</div><div class="progress-label"><span>Materi ${pr?.lesson_completed?100:0}% · Kuis ${pr?.quiz_passed?100:pr?.quiz_score!=null?Number(pr.quiz_score):0}%</span><b>${Math.round(((pr?.lesson_completed?50:0)+(pr?.quiz_passed?50:0)))}% selesai</b></div><div class="progress-track"><span style="width:${Math.round(((pr?.lesson_completed?50:0)+(pr?.quiz_passed?50:0)))}%"></span></div><div class="activity-actions" style="margin-top:10px">${actionBtn('Buka materi & kuis',`openInteractiveCourse('${x.id}','${a.id||x.activity_id}','${esc(name).replace(/'/g,"&#39;")}')`,'primary')}${!['approved'].includes(sub?.status)?actionBtn('Kirim foto praktik',`openSubmissionForm('${x.id}','${esc(name).replace(/'/g,"&#39;")}')`,'ghost'):''}</div></div>`:''}
 ${x.activity_type==='mission'&&a.instructions?`<details><summary>Instruksi mission</summary><div style="white-space:pre-wrap;margin-top:8px">${esc(a.instructions)}</div><b>Kriteria berhasil</b><div style="white-space:pre-wrap">${esc(a.success_criteria||'')}</div></details>`:''}
 ${x.activity_type==='simulation'?`<details><summary>Buka skenario simulasi</summary><div style="white-space:pre-wrap;margin-top:8px">${esc(a.scenario||'')}</div><b>Kriteria berhasil</b><div style="white-space:pre-wrap">${esc(a.success_criteria||'')}</div></details>`:''}
 ${sub?`<div class="submission-box"><b>Status evidence:</b> ${pill(sub.status)}${sub.review_score!=null?`<p style="margin-top:8px"><b>Nilai evidence mentor:</b> ${Number(sub.review_score)}/100</p>`:''}${sub.reviewer_feedback?`<p style="white-space:pre-wrap;color:var(--text);margin-top:8px"><b>Feedback mentor:</b> ${esc(sub.reviewer_feedback)}</p>`:''}${sub.evidence_url?`<div class="small muted">Foto evidence sudah dikirim untuk diperiksa mentor.</div>`:''}${sub.status==='revision_requested'?`<p class="small muted">Silakan perbaiki foto/catatan lalu kirim kembali.</p>`:''}</div>`:''}
 ${x.activity_type!=='course'?`<div class="activity-actions">${sub?.status==='approved'?`<span class="pill ok">Disetujui mentor</span>`:actionBtn(sub?'Kirim / perbarui foto evidence':'Mulai & kirim foto evidence',`openSubmissionForm('${x.id}','${esc(name).replace(/'/g,"&#39;")}')`,'primary')}</div>`:''}</article>`}).join('')||`<div class="empty card">Learning Path masih kosong. Minta admin/mentor menugaskan course dan mission.</div>`}</div>`;
}
/* V20 LEARNING CONTENT ENGINE — additive only; preserves auth, roles, database calls and progress workflow. */
function wdsLessonPack(course){
 const code=String(course.course_code||'').toUpperCase();
 const title=String(course.name||'Course');
 const text=(String(course.description||'')+' '+String(course.content||'')+' '+String(course.scenario||'')).toLowerCase();
 const packs={
 'CRS-001':[
 ['Definisi: safety, hazard, dan compliance','Safety adalah upaya mencegah cedera, kerusakan, dan kondisi tidak terkendali. Hazard ialah sumber atau keadaan yang berpotensi menimbulkan bahaya. Compliance berarti bekerja sesuai SOP, aturan, izin, dan batas kewenangan yang berlaku. Menemukan hazard tidak otomatis berarti mengetahui penyebabnya; temuan harus dinilai dan ditangani secara proporsional.'],
 ['Prinsip kontrol risiko','Urutan berpikir: kenali bahaya → tentukan siapa/apa yang terpapar → nilai tingkat risiko → gunakan pengendalian sesuai SOP → pastikan kondisi aman sebelum pekerjaan dilanjutkan. APD bukan pengganti pengendalian teknis atau isolasi energi bila prosedur mewajibkannya. Jangan melakukan LOTO atau pekerjaan berisiko tanpa pelatihan, otorisasi, dan prosedur perusahaan.'],
 ['Studi kasus: guard mesin longgar','Saat inspeksi, kamu melihat pelindung mesin tidak terpasang rapat. Jangan menyentuh area bergerak atau menghidupkan mesin untuk “menguji sebentar”. Jauhkan orang dari area berbahaya, ikuti prosedur stop/isolasi yang berlaku, informasikan kepada penanggung jawab, dan catat lokasi serta kondisi aktual.'],
 ['Kesalahan umum dan batas kewenangan','Hindari melewati interlock, melepas guard saat mesin bergerak, menganggap kejadian kecil sebagai hal normal, atau mengerjakan isolasi energi tanpa kewenangan. Jika kondisi belum aman atau prosedur tidak jelas, hentikan pekerjaan sesuai aturan dan eskalasi.'],
 ['Latihan penerapan','Sebutkan hazard yang terlihat, siapa yang berpotensi terpapar, tindakan awal yang aman, pihak yang perlu diberi tahu, dan bukti yang harus dicatat. Jawaban dinilai dari alasan dan kepatuhan pada SOP, bukan dari kecepatan bertindak.']],
 'CRS-002':[
 ['Definisi integritas data','Integritas data berarti catatan mencerminkan kondisi yang benar-benar diamati atau diukur. Actual adalah hasil aktual; target adalah sasaran; estimasi adalah perkiraan; hipotesis adalah dugaan yang belum dibuktikan. Keempatnya tidak boleh dipertukarkan.'],
 ['Cara menyusun laporan faktual','Catat waktu, lokasi/mesin, kondisi awal, nilai aktual beserta satuannya, metode pengamatan, dampak, tindakan sementara, dan status tindak lanjut. Tandai data yang belum tersedia secara jujur. Bila ada koreksi, ikuti mekanisme revisi agar jejak perubahan tetap dapat ditelusuri.'],
 ['Studi kasus: target dan aktual berbeda','Target availability 95%, aktual 87%. Laporan yang benar menampilkan keduanya, periode pengukuran, dan sumber data. Penyebab belum boleh dinyatakan sebagai “operator lalai” atau “maintenance terlambat” sebelum ada bukti. Tulis penyebab sebagai dugaan sementara jika masih perlu verifikasi.'],
 ['Menanggapi kesalahan data','Jika menemukan angka keliru, jangan menghapus jejak atau menyalahkan orang. Beri tahu pihak yang berwenang, koreksi melalui prosedur, jelaskan sumber perubahan, dan pastikan penerima laporan mengetahui revisi tersebut.'],
 ['Latihan penerapan','Buat laporan singkat berisi fakta, data yang belum diketahui, dampak yang mungkin terjadi, tindakan sementara, dan langkah verifikasi berikutnya. Pisahkan dengan jelas fakta dari interpretasi.']],
 'CRS-003':[
 ['Definisi task, output, dan outcome','Task adalah aktivitas yang diminta. Output adalah hasil langsung aktivitas. Outcome adalah kondisi atau manfaat yang harus dipastikan setelah output selesai. Ownership berarti menjaga agar hasil benar-benar memenuhi tujuan, melakukan follow-through, dan mengomunikasikan status—bukan mengambil alih semua kewenangan.'],
 ['Prinsip ownership yang sehat','Sebelum mulai, pahami tujuan dan kriteria selesai. Saat bekerja, pantau kendala dan dampak ke proses berikutnya. Setelah selesai, verifikasi hasil, dokumentasikan bukti, beri tahu pihak terkait, dan pastikan item yang belum tuntas memiliki pemilik serta waktu tindak lanjut.'],
 ['Studi kasus: komponen sudah diganti','Peserta mengganti komponen sesuai instruksi, tetapi belum ada pemeriksaan hasil dan operator belum mendapat informasi. Task mungkin selesai, namun outcome belum terkonfirmasi. Langkah berikutnya adalah mengikuti prosedur uji/verifikasi yang diizinkan, mencatat hasil, menyerahkan status kepada penanggung jawab, dan tidak mengoperasikan mesin di luar otorisasi.'],
 ['Ownership bukan bertindak tanpa batas','Inisiatif tidak berarti mengubah setting, menyetujui risiko, atau menjalankan mesin tanpa izin. Junior menunjukkan ownership dengan mengenali gap, menjaga keselamatan, mengumpulkan fakta, menghubungi pemilik keputusan, dan menindaklanjuti sampai status jelas.'],
 ['Latihan penerapan','Untuk tugas yang diberikan, tuliskan tujuan akhirnya, bukti bahwa hasil memenuhi standar, siapa yang perlu menerima handover, apa yang masih terbuka, dan kapan kamu harus eskalasi.']],
 'CRS-004':[
 ['Definisi gejala, penyebab, dan akar penyebab','Gejala adalah tanda yang terlihat; penyebab adalah faktor yang berkontribusi; akar penyebab adalah faktor mendasar yang jika dikendalikan dapat mencegah masalah berulang. Akar penyebab tidak boleh dipilih hanya karena terdengar masuk akal—ia perlu didukung bukti.'],
 ['Metode 5 Why dan fishbone','5 Why menelusuri hubungan sebab-akibat dengan pertanyaan “mengapa” yang didukung fakta. Fishbone membantu mengelompokkan kemungkinan faktor, misalnya mesin, metode, material, manusia, pengukuran, dan lingkungan. Keduanya alat berpikir, bukan bukti otomatis; hipotesis harus diuji.'],
 ['Studi kasus: benang sering putus','Pernyataan masalah yang baik menyebut mesin/posisi, waktu, frekuensi, jenis benang, dan kondisi saat kejadian. Kemungkinan faktor dapat mencakup tegangan, kualitas material, jalur benang, komponen aus, atau kondisi proses. Periksa catatan dan kondisi aktual sesuai SOP sebelum menyimpulkan.'],
 ['Containment vs corrective action','Containment mengurangi paparan atau dampak saat ini. Corrective action mengatasi penyebab yang sudah diverifikasi. Mengganti komponen tanpa memahami penyebab bisa menghilangkan gejala sementara tetapi tidak mencegah pengulangan.'],
 ['Latihan penerapan','Tulis problem statement terukur, tiga hipotesis, bukti yang mendukung/menolak masing-masing, tindakan containment aman, dan cara memverifikasi efektivitas perbaikan.']],
 'CRS-005':[
 ['Definisi keputusan berbasis data','Keputusan berbasis data menggabungkan fakta yang relevan, tingkat ketidakpastian, risiko, batas kewenangan, dan konsekuensi pilihan. Data membantu keputusan, tetapi data yang tidak lengkap harus diakui, bukan ditutupi.'],
 ['Kerangka keputusan praktis','Rumuskan masalah → pastikan kondisi aman → kumpulkan data minimum → pisahkan fakta dan asumsi → bandingkan opsi serta risiko → pilih tindakan dalam kewenangan → catat alasan → tentukan kapan evaluasi ulang atau eskalasi.'],
 ['Studi kasus: mesin berhenti berulang','Catatan menunjukkan mesin berhenti tiga kali, tetapi penyebab belum diketahui. Jangan langsung mengganti setting atau menyalahkan operator. Amankan sesuai prosedur, cek riwayat alarm dan kondisi yang boleh diperiksa, lalu eskalasi jika diagnosis memerlukan kewenangan atau alat khusus.'],
 ['Mengelola ketidakpastian','Keputusan yang baik bukan selalu keputusan yang paling cepat. Jika informasi penting hilang atau risiko tinggi, tindakan terbaik bisa berupa containment aman dan meminta pemeriksaan dari pihak berwenang. Catat apa yang diketahui dan apa yang masih belum diketahui.'],
 ['Latihan penerapan','Bandingkan dua opsi tindakan. Jelaskan bukti yang digunakan, risiko setiap opsi, asumsi yang belum terbukti, siapa yang berwenang menyetujui, dan indikator untuk mengecek hasil.']],
 'CRS-006':[
 ['Definisi berpikir 2–3 langkah ke depan','Berpikir ke depan berarti memperkirakan konsekuensi langsung dan konsekuensi lanjutan sebelum bertindak. Tujuannya bukan meramal dengan pasti, tetapi mengenali rantai dampak, sinyal peringatan dini, dan titik untuk mencegah dampak membesar.'],
 ['Peta konsekuensi','Tindakan → efek langsung → efek pada proses berikutnya → dampak terhadap keselamatan, kualitas, waktu, atau biaya. Untuk setiap langkah, tanyakan: apa yang dapat gagal, siapa yang terdampak, tanda awal apa yang terlihat, dan bagaimana membatasi risikonya?'],
 ['Studi kasus: mengejar target produksi','Mempercepat restart tanpa verifikasi mungkin menghemat waktu sesaat, tetapi berpotensi memicu kerusakan ulang, cacat produk, atau risiko bagi operator. Pilihan yang lebih baik adalah mengikuti kriteria restart, memberi informasi kepada pihak terkait, dan memastikan hasil memenuhi standar.'],
 ['Membedakan kemungkinan dan kepastian','Gunakan bahasa “berpotensi”, “perlu diperiksa”, atau “berdasarkan data saat ini” bila konsekuensi belum terbukti. Hindari menganggap semua kemungkinan pasti terjadi. Prioritaskan skenario berdasarkan tingkat risiko dan bukti.'],
 ['Latihan penerapan','Pilih satu tindakan dan buat peta tiga langkah: dampak langsung, dampak lanjutan, sinyal peringatan, serta tindakan pencegahan atau eskalasi yang sesuai.']],
 'CRS-007':[
 ['Definisi komunikasi kerja terstruktur','Komunikasi terstruktur menyampaikan informasi yang dibutuhkan penerima untuk memahami situasi dan mengambil tindakan. Pesan harus faktual, singkat, lengkap, dan menyebut kebutuhan keputusan atau tindak lanjut.'],
 ['Format Situation–Action–Status','Situation: apa, di mana, dan kapan terjadi. Action: tindakan aman yang telah dilakukan. Status: kondisi sekarang, risiko tersisa, bantuan/keputusan yang dibutuhkan, serta kapan update berikutnya. Gunakan istilah dan kanal yang berlaku di tempat kerja.'],
 ['Studi kasus: handover shift','Jangan hanya menulis “mesin bermasalah”. Sertakan kode mesin, waktu kejadian, gejala yang teramati, tindakan yang telah dilakukan, status operasi, risiko yang belum terselesaikan, bukti pendukung, dan siapa yang bertanggung jawab atas langkah berikutnya.'],
 ['Konfirmasi pemahaman','Minta penerima mengulang poin penting jika risikonya tinggi atau instruksi kompleks. Catat keputusan penting sesuai prosedur. Bila terjadi perbedaan pemahaman, luruskan fakta sebelum pekerjaan dilanjutkan.'],
 ['Latihan penerapan','Tulis pesan handover maksimal beberapa kalimat yang mencakup situasi, tindakan, status, kebutuhan, penanggung jawab, dan waktu pembaruan.']],
 'CRS-008':[
 ['Definisi assertiveness dan konflik kerja','Assertiveness adalah menyampaikan fakta, kebutuhan, dan batas secara jelas serta hormat. Konflik sering muncul karena target, informasi, prioritas, atau persepsi berbeda. Fokuskan pembahasan pada masalah dan bukti, bukan menyerang pribadi.'],
 ['Cara menangani perbedaan pendapat','Dengarkan sudut pandang pihak lain → ulangi inti masalah untuk memastikan pemahaman → tunjukkan data yang tersedia → jelaskan dampak dan risiko → cari tindakan yang disepakati → dokumentasikan pemilik dan tenggat → eskalasi melalui jalur resmi bila risiko tidak terkendali.'],
 ['Studi kasus lintas departemen','Departemen produksi ingin mesin segera berjalan, sementara maintenance masih memerlukan verifikasi. Sampaikan kondisi aktual, pemeriksaan yang belum selesai, risiko jika restart dilakukan sekarang, dan siapa yang harus memberi otorisasi. Hindari kalimat menyalahkan atau janji yang di luar kewenangan.'],
 ['Batas profesional','Tetap tenang bukan berarti menyetujui tindakan yang tidak aman. Jika tekanan berlanjut, ulangi fakta dan prosedur, gunakan jalur eskalasi yang berlaku, serta dokumentasikan keputusan penting sesuai kebijakan perusahaan.'],
 ['Latihan penerapan','Susun respons yang mengakui kebutuhan pihak lain, menjelaskan fakta dan risiko, menawarkan langkah berikutnya, serta menyebut pihak yang berwenang memutuskan.']],
 'CRS-009':[
 ['Definisi pola pikir teknis maintenance','Pola pikir teknis menghubungkan fungsi komponen, kondisi aktual, mode kegagalan, bukti, dan tindakan yang diizinkan. Tujuannya memahami apa yang terjadi tanpa melompat dari gejala ke diagnosis yang belum terbukti.'],
 ['Membaca gejala secara sistematis','Suara, getaran, temperatur, kebocoran, atau hasil proses yang berubah adalah petunjuk. Bandingkan dengan kondisi normal dan batas spesifikasi yang tersedia. Catat lokasi, waktu, pola, dan perubahan; gunakan alat ukur hanya jika terlatih dan diizinkan.'],
 ['Studi kasus: getaran tidak biasa','Getaran meningkat bisa memiliki banyak kemungkinan penyebab. Jangan menganggap satu penyebab pasti hanya dari gejala. Ikuti prosedur keselamatan, amankan jika diperlukan, kumpulkan pengamatan yang aman, tinjau riwayat gangguan, dan serahkan diagnosis lanjutan kepada personel berwenang.'],
 ['Memilih tindakan sesuai risiko','Bedakan observasi, inspeksi yang diizinkan, tindakan korektif, dan pekerjaan yang membutuhkan izin khusus. Jangan membuka guard, menyentuh bagian bergerak, atau mengubah setting tanpa otorisasi. Verifikasi setelah tindakan mengikuti kriteria resmi.'],
 ['Latihan penerapan','Buat tabel gejala, fakta pendukung, kemungkinan penyebab, bukti yang masih diperlukan, risiko, dan langkah berikutnya yang berada dalam kewenanganmu.']],
 'CRS-010':[
 ['Definisi composure under pressure','Composure under pressure adalah kemampuan menjaga kualitas penilaian dan komunikasi ketika ada tuntutan waktu, gangguan, atau tekanan sosial. Ini bukan berarti mengabaikan urgensi atau menahan semua emosi; artinya tetap mengikuti proses yang aman.'],
 ['Teknik pause–assess–act','Pause: hentikan reaksi impulsif dan pastikan keselamatan. Assess: identifikasi fakta, risiko, informasi yang hilang, serta batas kewenangan. Act: lakukan tindakan yang diizinkan, komunikasikan status, lalu verifikasi hasil. Dalam kondisi bahaya langsung, ikuti prosedur darurat perusahaan tanpa menunda.'],
 ['Studi kasus: target tertinggal','Mesin berhenti saat produksi tertinggal dan beberapa orang mendesak restart cepat. Prioritaskan kondisi aman dan kriteria restart, bukan tekanan suara paling keras. Sampaikan apa yang diketahui, pemeriksaan yang belum selesai, serta keputusan yang diperlukan dari pihak berwenang.'],
 ['Menghindari dua ekstrem','Panik dapat membuat orang melompat ke kesimpulan; terlalu pasif dapat menunda pengamanan. Respons yang baik tetap aktif: amankan kondisi, kumpulkan fakta minimum, komunikasikan, dan eskalasi tepat waktu.'],
 ['Latihan penerapan','Pilih respons untuk skenario tekanan. Jelaskan fakta, risiko, tindakan pertama, kalimat komunikasi yang akan digunakan, dan kondisi yang membuatmu harus berhenti atau eskalasi.']],
 'CRS-011':[
 ['Definisi learning agility','Learning agility adalah kemampuan mengambil pelajaran dari pengalaman dan feedback, mengubah pendekatan, lalu membuktikan perubahan itu dalam perilaku. Mendengar feedback saja belum berarti belajar; perubahan harus terlihat pada pekerjaan berikutnya.'],
 ['Mengolah feedback menjadi tindakan','Dengarkan tanpa menyela → minta contoh spesifik → bedakan fakta dari interpretasi → pilih satu perilaku yang perlu diubah → tentukan cara latihan → minta observasi ulang → bandingkan hasil sebelum dan sesudah.'],
 ['Studi kasus: laporan terlalu umum','Mentor mengatakan laporanmu kurang bisa ditindaklanjuti. Minta contoh bagian yang belum jelas. Ubah laporan berikutnya agar mencakup waktu, lokasi, gejala, bukti, tindakan, status, dan kebutuhan. Setelah itu, minta mentor menilai apakah informasi lebih mudah digunakan.'],
 ['Menghindari defensif dan mengulang kesalahan','Jangan sekadar menjawab “siap diperbaiki”. Catat komitmen tindakan dan tenggat. Jika belum memahami feedback, tanyakan. Bila pendekatan baru tidak berhasil, evaluasi bukti dan coba perbaikan lain dengan arahan mentor.'],
 ['Latihan penerapan','Ubah satu feedback menjadi rencana: perilaku awal, perilaku target, kesempatan latihan, bukti keberhasilan, tanggal review, dan pertanyaan yang akan diajukan kepada mentor.']],
 'CRS-012':[
 ['Definisi readiness saat leader tidak ada','Readiness bukan berarti menggantikan atasan atau mengambil semua keputusan. Artinya mampu menjaga operasi dalam batas kewenangan, mengenali kondisi abnormal, membuat penilaian awal berbasis bukti, berkomunikasi, dan melakukan eskalasi saat diperlukan.'],
 ['Kerangka keputusan mandiri yang aman','Kenali tujuan dan standar → cek kondisi serta risiko → bedakan fakta dan asumsi → tentukan tindakan yang diizinkan → informasikan pihak terkait → catat keputusan dan alasan → verifikasi hasil atau serahkan tindak lanjut.'],

async function achievementsPage(){
 if(state.profile?.role==='participant'&&state.participant){
  const pid=state.participant.id;
  const [ar,sr,pr]=await Promise.all([
   sb.from('learning_assignments').select('id,status').eq('participant_id',pid),
   sb.from('learning_activity_submissions').select('id,status').eq('participant_id',pid),
   sb.from('learning_course_progress').select('lesson_completed,quiz_passed,quiz_score').eq('participant_id',pid)
  ]);
  if(ar.error)throw ar.error;if(sr.error)throw sr.error;if(pr.error)throw pr.error;
  const assignments=ar.data||[],subs=sr.data||[],progress=pr.data||[];
  const approved=subs.filter(x=>x.status==='approved').length;
  const completed=assignments.filter(x=>x.status==='completed').length;
  const lessons=progress.filter(x=>x.lesson_completed).length;
  const quizzes=progress.filter(x=>x.quiz_passed).length;
  const badges=[];
  if(assignments.length&&completed===assignments.length)badges.push(['🏁','Finisher','Seluruh aktivitas yang ditugaskan selesai.']);
  if(approved>=1)badges.push(['📷','Evidence pertama','Minimal satu hasil praktik disetujui mentor.']);
  if(lessons>=1)badges.push(['📘','Pembelajar aktif','Minimal satu course ditandai selesai dipelajari.']);
  if(quizzes>=1)badges.push(['🎯','Lulus kuis','Minimal satu kuis course berhasil dilalui.']);
  if(progress.length>=3)badges.push(['🔥','Konsisten belajar','Sudah memiliki progres pada tiga course atau lebih.']);
  return `<div class="hero-strip"><div class="small" style="color:#b7e5df;font-weight:800">MILESTONES</div><h2 style="color:#fff;margin:5px 0">Achievements</h2><p>Pencapaian dihitung dari aktivitas dan hasil yang tersimpan. Badge ini adalah milestone belajar, bukan sertifikasi kompetensi.</p></div>${metrics([['Aktivitas selesai',completed,`dari ${assignments.length} ditugaskan`],['Evidence disetujui',approved,'oleh mentor'],['Materi selesai',lessons,'course'],['Kuis lulus',quizzes,'course']])}<div class="activity-grid">${badges.map(b=>`<article class="activity-card"><div style="font-size:32px">${b[0]}</div><h3>${b[1]}</h3><p>${b[2]}</p><span class="pill ok">Tercapai</span></article>`).join('')||'<div class="empty card">Belum ada milestone tercapai. Mulai dari materi dan aktivitas di My Learning Path.</div>'}</div><div class="notice" style="margin-top:14px">Milestone dihitung dari data yang sudah tersimpan di database. Ini bukan penilaian readiness final.</div>`;
 }
 const {count:p}=await sb.from('participants').select('*',{count:'exact',head:true});
 return `<h2>Achievements</h2>${metrics([['Peserta',p||0,'terdaftar']])}<div class="card"><p>Milestone peserta dihitung dari aktivitas, evidence, materi, dan kuis yang tersimpan. Pilih akun peserta untuk melihat pencapaiannya.</p></div>`;
}
